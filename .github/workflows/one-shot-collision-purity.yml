name: One-shot collision purity remediation

on:
  push:
    branches:
      - agent/fix-core-gameplay-invariants

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-core-gameplay-invariants
          fetch-depth: 0

      - name: Apply collision purity patch
        run: python3 scripts/patch_collision_purity.py

      - name: Commit patched source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Collision source already matches the audited patch."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/yourname/forest_run/engine/EntityManager.kt
          git add app/src/main/java/com/yourname/forest_run/entities/Entity.kt
          git add app/src/main/java/com/yourname/forest_run/entities/animals/Cat.kt
          git add app/src/main/java/com/yourname/forest_run/entities/animals/Fox.kt
          git add app/src/main/java/com/yourname/forest_run/entities/animals/Hedgehog.kt
          git add app/src/main/java/com/yourname/forest_run/entities/birds/Duck.kt
          git add app/src/main/java/com/yourname/forest_run/entities/birds/ChickadeeGroup.kt
          git add app/src/main/java/com/yourname/forest_run/entities/birds/TitGroup.kt
          git add app/src/main/java/com/yourname/forest_run/entities/birds/Owl.kt
          git add app/src/main/java/com/yourname/forest_run/entities/birds/Eagle.kt
          git commit -m "fix: separate entity interaction from collision queries"
          git push origin HEAD:agent/fix-core-gameplay-invariants
