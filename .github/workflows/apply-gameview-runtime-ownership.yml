name: Apply GameView runtime ownership

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-gameview-runtime-ownership.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gameview-runtime-ownership-main
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify and apply exact-marker migrations
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 -m unittest scripts.test_gameview_runtime_adoption_migrations
          python3 scripts/apply_gameview_collision_adapter.py
          python3 scripts/apply_gameview_collision_adapter.py --check
          python3 scripts/apply_gameview_run_session_coordinator.py
          python3 scripts/apply_gameview_run_session_coordinator.py --check
          git diff --check

      - name: Remove temporary migration machinery and verify permanent contract
        run: |
          set -euo pipefail
          rm scripts/apply_gameview_collision_adapter.py
          rm scripts/apply_gameview_run_session_coordinator.py
          rm scripts/test_gameview_runtime_adoption_migrations.py
          rm .github/workflows/apply-gameview-runtime-ownership.yml
          python3 -m unittest scripts.test_gameview_runtime_ownership_contract
          git diff --check

      - name: Commit directly to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(runtime): adopt collision and session coordinators"
          git pull --rebase origin main
          git push origin HEAD:main
