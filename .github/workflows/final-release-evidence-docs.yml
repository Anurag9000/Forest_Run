name: Final release evidence docs migration

on:
  push:
    branches: [main]
    paths:
      - scripts/migrate_final_release_evidence_docs.py
      - .github/workflows/final-release-evidence-docs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Apply guarded documentation reconciliation
        run: python3 scripts/migrate_final_release_evidence_docs.py
      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir -r scripts/requirements-ci.txt
      - name: Verify reconciled source and docs
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 -m unittest discover -s scripts -p 'test_*.py'
          test ! -e scripts/migrate_final_release_evidence_docs.py
          test ! -e .github/workflows/final-release-evidence-docs.yml
          grep -q -- '--require-bound-kind installed_identity_matrix' docs/RELEASE_EVIDENCE_INDEX.md
          grep -q -- '--require-bound-kind play_delivery' docs/RELEASE_EVIDENCE_INDEX.md
          grep -q -- '--installed-identity-matrix' docs/RELEASE_READINESS.md
          grep -q -- '--play-delivery' docs/RELEASE_READINESS.md
          grep -q 'INSTALLED_CANDIDATE_IDENTITY.md' README.md
      - name: Commit descendant to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'forest-run-migration-bot'
          git config user.email 'forest-run-migration-bot@users.noreply.github.com'
          git add -A
          git commit -m 'docs(release): reconcile final evidence chain'
          git push origin HEAD:main
