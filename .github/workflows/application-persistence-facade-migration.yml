name: Application persistence facade migration

on:
  push:
    branches: [main]
    paths:
      - scripts/migrate_application_persistence_facade_adoption.py
      - .github/workflows/application-persistence-facade-migration.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: application-persistence-facade-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Apply exact persistence migration
        run: python3 scripts/migrate_application_persistence_facade_adoption.py
      - name: Verify narrow result
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e scripts/migrate_application_persistence_facade_adoption.py
          test ! -e .github/workflows/application-persistence-facade-migration.yml
          grep -q 'ApplicationPersistenceFacade.android(context)' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          grep -q 'encounterPersistence = applicationPersistence' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          grep -q 'encounterPersistence.recordEncounter(type)' app/src/main/java/com/anurag9000/forestrun/engine/EntityManager.kt
          grep -q 'persistenceFacade.purchaseNextGardenPlant(i)' app/src/main/java/com/anurag9000/forestrun/ui/GardenScreen.kt
          grep -q 'persistenceFacade.saveFeedbackPreferences' app/src/main/java/com/anurag9000/forestrun/ui/FeedbackSettingsPanel.kt
      - name: Commit directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'forest-run-migration-bot'
          git config user.email 'forest-run-migration-bot@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(persistence): adopt application facade live'
          git push origin HEAD:main
