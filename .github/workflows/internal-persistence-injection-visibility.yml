name: Internal persistence injection visibility

on:
  push:
    branches: [main]
    paths:
      - scripts/migrate_internal_persistence_injection_visibility.py
      - .github/workflows/internal-persistence-injection-visibility.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - run: python3 scripts/migrate_internal_persistence_injection_visibility.py
      - shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e scripts/migrate_internal_persistence_injection_visibility.py
          test ! -e .github/workflows/internal-persistence-injection-visibility.yml
          grep -q 'class EntityManager internal constructor(' app/src/main/java/com/anurag9000/forestrun/engine/EntityManager.kt
          grep -q 'class MainMenuScreen internal constructor(' app/src/main/java/com/anurag9000/forestrun/ui/MainMenuScreen.kt
          grep -q 'class GardenScreen internal constructor(' app/src/main/java/com/anurag9000/forestrun/ui/GardenScreen.kt
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name 'forest-run-migration-bot'
          git config user.email 'forest-run-migration-bot@users.noreply.github.com'
          git add -A
          git commit -m 'fix(persistence): keep injected ports internal'
          git push origin HEAD:main
