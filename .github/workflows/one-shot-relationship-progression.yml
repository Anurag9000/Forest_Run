name: One-shot relationship progression

on:
  push:
    branches:
      - agent/fix-core-gameplay-invariants

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-core-gameplay-invariants
          fetch-depth: 0

      - name: Apply relationship progression patch
        run: python3 scripts/patch_relationship_progression.py

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager 'platforms;android-36' >/dev/null
          status=${PIPESTATUS[1]}
          set -o pipefail
          exit "$status"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile production and tests
        run: ./gradlew compileDebugKotlin compileDebugUnitTestKotlin --no-daemon --stacktrace --console=plain

      - name: Run relationship and full unit suites
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace --console=plain

      - name: Run debug and release lint
        run: ./gradlew lintDebug lintRelease --no-daemon --stacktrace --console=plain

      - name: Commit verified relationship semantics
        shell: bash
        run: |
          rm scripts/patch_relationship_progression.py
          rm .github/workflows/one-shot-relationship-progression.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/anurag9000/forestrun/engine/RelationshipArcSystem.kt
          git add app/src/main/java/com/anurag9000/forestrun/engine/PersistentMemoryManager.kt
          git add app/src/test/java/com/anurag9000/forestrun/engine/RelationshipProgressionInvariantTest.kt
          git add -u scripts/patch_relationship_progression.py
          git add -u .github/workflows/one-shot-relationship-progression.yml
          git commit -m "fix: earn relationship trust through positive outcomes"
          git push origin HEAD:agent/fix-core-gameplay-invariants
