name: One-shot Garden layout remediation

on:
  push:
    branches:
      - agent/fix-core-gameplay-invariants

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-core-gameplay-invariants
          fetch-depth: 0

      - name: Apply Garden layout patch
        run: python3 scripts/patch_garden_layout.py

      - name: Commit patched source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Garden layout is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/yourname/forest_run/ui/GardenScreen.kt
          git commit -m "fix: separate Garden surfaces and wrap panel text"
          git push origin HEAD:agent/fix-core-gameplay-invariants
