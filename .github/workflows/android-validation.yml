name: Android validation

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

concurrency:
  group: android-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: Compile, test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-core-gameplay-invariants
          fetch-depth: 0

      - name: Apply staged source remediation
        shell: bash
        run: python3 scripts/patch_debug_persistence_isolation.py

      - name: Upload staged remediation source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staged-debug-persistence-source
          path: |
            app/src/main/java/com/yourname/forest_run/engine/EntityManager.kt
            app/src/main/java/com/yourname/forest_run/engine/GameView.kt
            app/src/main/java/com/yourname/forest_run/entities/animals/Cat.kt
          if-no-files-found: error
          retention-days: 7

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Report packaged sprite dimensions
        run: find app/src/main/assets/sprites -type f -name '*.png' -print0 | sort -z | xargs -0 file | tee sprite-dimensions.txt

      - name: Upload sprite dimension inventory
        uses: actions/upload-artifact@v4
        with:
          name: sprite-dimensions
          path: sprite-dimensions.txt
          if-no-files-found: error
          retention-days: 7

      - name: Compile debug sources and tests
        shell: bash
        run: |
          set +e
          ./gradlew compileDebugKotlin compileDebugUnitTestKotlin \
            --no-daemon --stacktrace --console=plain > compile.log 2>&1
          status=$?
          if [[ $status -ne 0 ]]; then
            echo "::group::Kotlin compiler diagnostics"
            grep -E '(^e: | error: |FAILURE:|Execution failed for task|\* What went wrong:)' compile.log || true
            echo "::endgroup::"
            echo "::group::Final compile log"
            tail -n 160 compile.log
            echo "::endgroup::"
          fi
          exit $status

      - name: Run debug unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace --console=plain

      - name: Run debug lint
        run: ./gradlew lintDebug --no-daemon --stacktrace --console=plain

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace --console=plain

      - name: Commit verified remediation source
        if: success() && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Debug persistence isolation already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/yourname/forest_run/engine/EntityManager.kt
          git add app/src/main/java/com/yourname/forest_run/engine/GameView.kt
          git add app/src/main/java/com/yourname/forest_run/entities/animals/Cat.kt
          git commit -m "fix: isolate deterministic scenarios from persistence"
          git push origin HEAD:agent/fix-core-gameplay-invariants

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-log
          path: compile.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: forest-run-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
