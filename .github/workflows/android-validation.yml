name: Android validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-validation:
    name: Host, release, lint, and packaging
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the exact candidate SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable source contracts
        shell: bash
        run: |
          set -euo pipefail
          forbidden_script="scripts/patch_runtime_workload_"telemetry.py
          test ! -e "$forbidden_script"
          if grep -R --line-number -E 'contents:[[:space:]]*write|git[[:space:]]+push' .github/workflows; then
            echo "Validation workflows must not mutate or push repository source." >&2
            exit 1
          fi

          grep -q 'RuntimeWorkloadTelemetry.publishEntities' app/src/main/java/com/anurag9000/forestrun/engine/EntityManager.kt
          grep -q 'RuntimeWorkloadTelemetry.publishSeedOrbs' app/src/main/java/com/anurag9000/forestrun/systems/SeedOrbManager.kt
          grep -q 'RuntimeWorkloadTelemetry.publishParticles' app/src/main/java/com/anurag9000/forestrun/systems/ParticleManager.kt
          grep -q 'RuntimeWorkloadTelemetry.publishDialogueBubbles' app/src/main/java/com/anurag9000/forestrun/ui/DialogueBubbleManager.kt
          grep -q 'RuntimeWorkloadTelemetry.publishFlavorTexts' app/src/main/java/com/anurag9000/forestrun/ui/FlavorTextManager.kt
          grep -q 'RuntimeWorkloadTelemetry.reset()' app/src/main/java/com/anurag9000/forestrun/engine/FramePerformanceTelemetry.kt
          grep -q 'val workload: RuntimeWorkloadSnapshot' app/src/main/java/com/anurag9000/forestrun/engine/FramePerformanceReport.kt
          grep -q 'workload = RuntimeWorkloadTelemetry.snapshot()' app/src/androidTest/java/com/anurag9000/forestrun/HardwarePerformanceProfileTest.kt

          test -f app/src/main/java/com/anurag9000/forestrun/engine/InputLatencyTelemetry.kt
          test -f app/src/main/java/com/anurag9000/forestrun/engine/InputLatencyReport.kt
          test -f app/src/androidTest/java/com/anurag9000/forestrun/HardwareInputLatencyProfileTest.kt
          test -f app/src/test/java/com/anurag9000/forestrun/engine/InputLatencyTelemetryTest.kt
          test -f app/src/test/java/com/anurag9000/forestrun/engine/InputLatencyReportTest.kt
          grep -q 'InputLatencyTelemetryRegistry.recordFrameRendered' app/src/main/java/com/anurag9000/forestrun/engine/GameThread.kt
          grep -q 'InputLatencyTelemetryRegistry.recordTouchReceived' app/src/main/java/com/anurag9000/forestrun/engine/InputHandler.kt

          grep -q 'persistenceFacade.purchaseNextGardenPlant' app/src/main/java/com/anurag9000/forestrun/ui/GardenScreen.kt
          grep -q 'GardenPurchaseManager.purchaseNext' app/src/main/java/com/anurag9000/forestrun/engine/ApplicationPersistenceFacade.kt
          if grep -q 'SaveManager.saveGardenProgress\|SaveManager.saveLifetimeSeeds\|GardenPurchaseManager.purchaseNext' app/src/main/java/com/anurag9000/forestrun/ui/GardenScreen.kt; then
            echo "GardenScreen must use the application facade and its single atomic purchase boundary." >&2
            exit 1
          fi
          grep -q 'buildSanctuaryAtmosphere' app/src/main/java/com/anurag9000/forestrun/engine/GardenSanctuaryPlanner.kt
          test -f app/src/main/java/com/anurag9000/forestrun/engine/SanctuaryAtmosphere.kt
          test -f app/src/test/java/com/anurag9000/forestrun/engine/SanctuaryAtmosphereTest.kt
          test -f app/src/test/java/com/anurag9000/forestrun/ui/GardenScreenBoundaryTest.kt

          grep -q 'publicationSequence' app/src/main/java/com/anurag9000/forestrun/engine/FramePerformanceMonitor.kt
          grep -q 'publicationSequence' app/src/main/java/com/anurag9000/forestrun/engine/RuntimeWorkloadTelemetry.kt
          grep -q '@Synchronized' app/src/main/java/com/anurag9000/forestrun/engine/GhostIoTelemetry.kt
          test -f app/src/test/java/com/anurag9000/forestrun/engine/RuntimeWorkloadTelemetryTest.kt

          test -f app/src/main/java/com/anurag9000/forestrun/engine/DeterministicScenarioTrace.kt
          test -f app/src/test/java/com/anurag9000/forestrun/engine/DeterministicScenarioTraceTest.kt
          grep -q 'DebugScenarioInputContract.validate' app/src/main/java/com/anurag9000/forestrun/engine/DebugScenarioScript.kt
          grep -q '!deltaTime.isFinite() || deltaTime <= 0f' app/src/main/java/com/anurag9000/forestrun/systems/GhostPlayer.kt
          test -f app/src/test/java/com/anurag9000/forestrun/systems/GhostPlayerMalformedDeltaAdmissionTest.kt
          test -f app/src/main/java/com/anurag9000/forestrun/engine/DeterministicScenarioTraceEvidenceVerifier.kt
          test -f app/src/test/java/com/anurag9000/forestrun/engine/DeterministicScenarioTraceEvidenceVerifierTest.kt
          grep -q 'decodeCanonical(payloadJson)' app/src/main/java/com/anurag9000/forestrun/engine/DeterministicScenarioTraceEvidenceVerifier.kt
          grep -q 'DeterministicScenarioTraceEvidenceCodec.isCanonical' app/src/main/java/com/anurag9000/forestrun/engine/DeterministicScenarioTraceEvidenceStore.kt
          if grep -q 'lastParameterUpdateNs' app/src/main/java/com/anurag9000/forestrun/engine/LeitmotifManager.kt; then
            echo "EvaluationThrottle must remain the sole leitmotif interval gate." >&2
            exit 1
          fi

          test -f app/src/main/java/com/anurag9000/forestrun/engine/EncounterActionFeasibility.kt
          test -f app/src/test/java/com/anurag9000/forestrun/engine/EncounterActionFeasibilityTest.kt
          test -f app/src/test/java/com/anurag9000/forestrun/engine/CollisionArbitrationPropertyTest.kt

          test -f scripts/evaluate_performance_profiles.py
          test -f scripts/test_evaluate_performance_profiles.py
          test -f scripts/collect_performance_profiles.sh
          test -f scripts/test_performance_collection_contract.py
          grep -q 'verify_origin_main.sh' scripts/collect_performance_profiles.sh
          grep -q 'verify_main_candidate.py' scripts/collect_performance_profiles.sh

          test -f scripts/evaluate_input_latency_profiles.py
          test -f scripts/test_evaluate_input_latency_profiles.py
          test -f scripts/collect_input_latency_profile.sh
          test -f docs/INPUT_LATENCY_EXPERIMENT.md
          grep -q 'verify_origin_main.sh' scripts/collect_input_latency_profile.sh
          grep -q 'verify_main_candidate.py' scripts/collect_input_latency_profile.sh
          grep -q 'app_touch_to_posted_frame' scripts/evaluate_input_latency_profiles.py

          test -f scripts/compare_visual_regression.py
          test -f scripts/test_compare_visual_regression.py
          test -f scripts/test_visual_regression_trusted_root.py
          test -f scripts/test_visual_regression_symlink_root.py
          test -f scripts/visual_baseline_provenance.py
          test -f scripts/test_visual_baseline_provenance.py
          test -f docs/VISUAL_REGRESSION.md

          test -f scripts/run_connected_validation.sh
          test -f scripts/test_connected_validation_runner.py
          test -f scripts/verify_main_candidate.py
          test -f scripts/test_verify_main_candidate.py
          test -f scripts/verify_origin_main.sh
          test -f scripts/test_verify_origin_main.py

          test -f scripts/verify_release_source_assets.py
          test -f scripts/test_verify_release_source_assets.py
          test -f scripts/release_artifact_verifier.py
          test -f scripts/test_release_artifact_verifier.py
          test -f scripts/verify_android_page_size_package.py
          test -f scripts/test_verify_android_page_size_package.py
          test -f docs/ANDROID_PAGE_SIZE_COMPATIBILITY.md
          test -f scripts/prepare_main_release.sh
          grep -q 'verify_origin_main.sh' scripts/prepare_main_release.sh
          grep -q 'verify_release_source_assets.py' scripts/prepare_main_release.sh
          grep -q -- '--expected-sha' scripts/prepare_main_release.sh

          test -f scripts/capture_store_screenshots.sh
          test -f scripts/test_capture_store_screenshots_contract.py
          grep -q './gradlew clean assembleDebug' scripts/capture_store_screenshots.sh
          grep -q 'verify_origin_main.sh' scripts/capture_store_screenshots.sh
          grep -q 'shell pm clear' scripts/capture_store_screenshots.sh
          test -f scripts/screenshot_capture_evidence.py
          test -f scripts/test_screenshot_capture_evidence.py
          test -f scripts/verify_curated_screenshot_set.py
          test -f scripts/test_verify_curated_screenshot_set.py

          test -f scripts/strict_json.py
          test -f scripts/test_strict_json.py
          test -f scripts/test_strict_json_overflow.py
          test -f scripts/validate_device_acceptance.py
          test -f scripts/test_validate_device_acceptance.py
          test -f scripts/compile_device_acceptance.py
          test -f scripts/test_compile_device_acceptance.py
          test -f scripts/aggregate_device_acceptance.py
          test -f scripts/test_aggregate_device_acceptance.py
          test -f scripts/test_leitmotif_throttle_contract.py
          test -f scripts/requirements-ci.txt
          test -f docs/DEVICE_ACCEPTANCE.md
          test -f docs/DEVICE_ACCEPTANCE_AGGREGATION.md
          test -f docs/audits/2026-08-01_post_merge_audit.md

          test -f SECURITY.md
          test -f docs/SUPPLY_CHAIN_AND_SBOM.md
          test -f scripts/build_declared_dependency_inventory.py
          test -f scripts/test_build_declared_dependency_inventory.py
          test -f scripts/build_resolved_dependency_sbom.py
          test -f scripts/test_build_resolved_dependency_sbom.py
          test -f scripts/validate_supply_chain_evidence.py
          test -f scripts/test_validate_supply_chain_evidence.py
          test -f scripts/test_supply_chain_purl_binding.py
          grep -q 'declared-direct-dependencies-only' scripts/build_declared_dependency_inventory.py
          grep -q '"bomFormat": "CycloneDX"' scripts/build_resolved_dependency_sbom.py

          python3 scripts/verify_release_source_assets.py --root .

      - name: Install Python validation dependencies
        run: >-
          python3 -m pip install
          --disable-pip-version-check
          --no-cache-dir
          -r scripts/requirements-ci.txt

      - name: Test performance, release, and connected-validation tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Verify source immutability after host tooling
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'

      - name: Install Android API 36
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager 'platforms;android-36' >/dev/null
          status=${PIPESTATUS[1]}
          set -o pipefail
          exit "$status"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Build candidate-bound dependency evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir='build/supply-chain'
          rm -rf "$evidence_dir"
          mkdir -p "$evidence_dir"

          ./gradlew app:dependencies \
            --configuration releaseRuntimeClasspath \
            --no-daemon --console=plain \
            > "${evidence_dir}/releaseRuntimeClasspath.txt"

          ./gradlew app:dependencies \
            --configuration debugAndroidTestRuntimeClasspath \
            --no-daemon --console=plain \
            > "${evidence_dir}/debugAndroidTestRuntimeClasspath.txt"

          python3 scripts/build_declared_dependency_inventory.py \
            --root . \
            --candidate-sha "${GITHUB_SHA}" \
            --output "${evidence_dir}/declared-dependencies.json"

          python3 scripts/build_resolved_dependency_sbom.py \
            --candidate-sha "${GITHUB_SHA}" \
            --report "releaseRuntimeClasspath=${evidence_dir}/releaseRuntimeClasspath.txt" \
            --report "debugAndroidTestRuntimeClasspath=${evidence_dir}/debugAndroidTestRuntimeClasspath.txt" \
            --output "${evidence_dir}/resolved-sbom.cdx.json"

          python3 scripts/validate_supply_chain_evidence.py \
            --declared "${evidence_dir}/declared-dependencies.json" \
            --resolved "${evidence_dir}/resolved-sbom.cdx.json" \
            --expected-commit "${GITHUB_SHA}"

      - name: Compile, test, lint, assemble, and verify release hardening
        env:
          R8_FULL_MODE: 'true'
        run: >-
          ./gradlew --no-daemon --stacktrace --warning-mode all
          -PcandidateCommitSha="${GITHUB_SHA}"
          compileDebugKotlin
          compileDebugUnitTestKotlin
          compileReleaseKotlin
          compileDebugAndroidTestKotlin
          testDebugUnitTest
          lintDebug
          lintRelease
          assembleDebug
          assembleDebugAndroidTest
          bundleRelease

      - name: Inspect packaged native page-size alignment
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_android_page_size_package.py \
            --artifact app/build/outputs/apk/debug/app-debug.apk \
            --build-tools-dir "${ANDROID_HOME}/build-tools"
          python3 scripts/verify_android_page_size_package.py \
            --artifact app/build/outputs/bundle/release/app-release.aab \
            --build-tools-dir "${ANDROID_HOME}/build-tools"

      - name: Verify R8 and source immutability
        shell: bash
        run: |
          set -euo pipefail
          mapping='app/build/outputs/mapping/release/mapping.txt'
          usage='app/build/outputs/mapping/release/usage.txt'
          test -s "$mapping"
          test -s "$usage"
          git diff --exit-code
          git diff --cached --exit-code
          git status --short

      - name: Upload Android validation artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-validation-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/reports/
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/
            build/supply-chain/

  connected-validation:
    name: API 35 connected smoke and deterministic evidence
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: host-validation
    steps:
      - name: Check out the exact candidate SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install compile SDK and API 35 emulator package
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager \
            'platforms;android-36' \
            'platforms;android-35' \
            'system-images;android-35;google_apis;x86_64' >/dev/null
          status=${PIPESTATUS[1]}
          set -o pipefail
          exit "$status"

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run API 35 connected validation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disable-spellchecker: true
          emulator-boot-timeout: 900
          disk-size: 6000M
          heap-size: 1024M
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -no-snapshot
            -camera-back none
            -camera-front none
          script: bash scripts/run_connected_validation.sh --skip-origin-main-check --candidate-sha ${{ github.sha }}

      - name: Upload connected validation artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: connected-validation-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/connected_android_test_additional_output/
            app/build/outputs/androidTest-results/connected/
