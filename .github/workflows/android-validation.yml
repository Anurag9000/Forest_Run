name: Publish runtime workload telemetry

on:
  pull_request:

permissions:
  contents: write

jobs:
  publish:
    name: Validate and publish workload-correlated profiling
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-core-gameplay-invariants
          fetch-depth: 0

      - name: Apply runtime workload telemetry integration
        run: python3 scripts/patch_runtime_workload_telemetry.py

      - name: Verify transformed source contracts
        shell: bash
        run: |
          grep -q 'RuntimeWorkloadTelemetry.publishEntities' app/src/main/java/com/anurag9000/forestrun/engine/EntityManager.kt
          grep -q 'RuntimeWorkloadTelemetry.publishSeedOrbs' app/src/main/java/com/anurag9000/forestrun/systems/SeedOrbManager.kt
          grep -q 'RuntimeWorkloadTelemetry.publishParticles' app/src/main/java/com/anurag9000/forestrun/systems/ParticleManager.kt
          grep -q 'RuntimeWorkloadTelemetry.publishDialogueBubbles' app/src/main/java/com/anurag9000/forestrun/ui/DialogueBubbleManager.kt
          grep -q 'RuntimeWorkloadTelemetry.publishFlavorTexts' app/src/main/java/com/anurag9000/forestrun/ui/FlavorTextManager.kt
          grep -q 'RuntimeWorkloadTelemetry.reset()' app/src/main/java/com/anurag9000/forestrun/engine/FramePerformanceTelemetry.kt
          grep -q 'val workload: RuntimeWorkloadSnapshot' app/src/main/java/com/anurag9000/forestrun/engine/FramePerformanceReport.kt
          grep -q '"peakParticles"' app/src/main/java/com/anurag9000/forestrun/engine/FramePerformanceReport.kt
          grep -q 'workload = RuntimeWorkloadTelemetry.snapshot()' app/src/androidTest/java/com/anurag9000/forestrun/HardwarePerformanceProfileTest.kt
          test -f app/src/test/java/com/anurag9000/forestrun/engine/RuntimeWorkloadTelemetryTest.kt

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager 'platforms;android-36' >/dev/null
          status=${PIPESTATUS[1]}
          set -o pipefail
          exit "$status"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Compile test lint and assemble transformed tree
        run: >-
          ./gradlew
          compileDebugKotlin
          compileDebugUnitTestKotlin
          compileReleaseKotlin
          compileDebugAndroidTestKotlin
          testDebugUnitTest
          lintDebug
          lintRelease
          assembleDebug
          assembleDebugAndroidTest
          --no-daemon
          --stacktrace
          --console=plain

      - name: Commit validated integration
        shell: bash
        run: |
          rm scripts/patch_runtime_workload_telemetry.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/anurag9000/forestrun/engine/EntityManager.kt \
            app/src/main/java/com/anurag9000/forestrun/systems/SeedOrbManager.kt \
            app/src/main/java/com/anurag9000/forestrun/systems/ParticleManager.kt \
            app/src/main/java/com/anurag9000/forestrun/ui/DialogueBubbleManager.kt \
            app/src/main/java/com/anurag9000/forestrun/ui/FlavorTextManager.kt \
            app/src/main/java/com/anurag9000/forestrun/engine/FramePerformanceTelemetry.kt \
            app/src/main/java/com/anurag9000/forestrun/engine/FramePerformanceReport.kt \
            app/src/androidTest/java/com/anurag9000/forestrun/HardwarePerformanceProfileTest.kt \
            scripts/patch_runtime_workload_telemetry.py
          git commit -m 'perf: correlate frame timing with runtime workload'
          git push origin HEAD:agent/fix-core-gameplay-invariants
