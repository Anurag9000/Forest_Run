name: Android validation

on:
  push:
    branches:
      - agent/fix-core-gameplay-invariants
  pull_request:

concurrency:
  group: feedback-settings-remediation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: Apply feedback settings and validate debug/release
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-core-gameplay-invariants
          fetch-depth: 0

      - name: Apply persisted feedback settings
        run: python3 scripts/patch_feedback_settings.py

      - name: Verify feedback preference contracts
        shell: bash
        run: |
          test -f app/src/main/java/com/anurag9000/forestrun/engine/FeedbackSettings.kt
          test -f app/src/main/java/com/anurag9000/forestrun/ui/FeedbackSettingsPanel.kt
          grep -q 'FeedbackSettings.init(this)' app/src/main/java/com/anurag9000/forestrun/MainActivity.kt
          grep -q 'FeedbackSettings.hapticsEnabled' app/src/main/java/com/anurag9000/forestrun/engine/HapticManager.kt
          grep -q 'FeedbackSettings.audioEnabled' app/src/main/java/com/anurag9000/forestrun/engine/SfxManager.kt
          grep -q 'fun setAudioEnabled(enabled: Boolean)' app/src/main/java/com/anurag9000/forestrun/engine/LeitmotifManager.kt
          grep -q 'FeedbackSettings.reducedMotion' app/src/main/java/com/anurag9000/forestrun/engine/CameraSystem.kt
          grep -q 'adjustedParticleCount(emitter.count' app/src/main/java/com/anurag9000/forestrun/systems/ParticleManager.kt
          grep -q 'feedbackSettingsPanel.onTap' app/src/main/java/com/anurag9000/forestrun/ui/MainMenuScreen.kt
          grep -q 'feedbackSettingsPanel.draw' app/src/main/java/com/anurag9000/forestrun/ui/MainMenuScreen.kt

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager 'platforms;android-36' >/dev/null
          status=${PIPESTATUS[1]}
          set -o pipefail
          exit "$status"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Verify accumulated release contracts
        shell: bash
        run: |
          grep -q 'applicationId = "com.anurag9000.forestrun"' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'safeContentTransform.toLogical' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          grep -q 'GhostPersistenceManager.saveBestRunAsync' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          grep -q 'AtomicFile' app/src/main/java/com/anurag9000/forestrun/engine/SaveManager.kt
          grep -q 'private fun ensureShaders' app/src/main/java/com/anurag9000/forestrun/engine/CinematicPolish.kt
          grep -q 'private val tempoEvaluationThrottle' app/src/main/java/com/anurag9000/forestrun/engine/LeitmotifManager.kt
          if git grep -n -E 'com\.google\.gson|Gson|SerializedName|TypeToken' -- app/src; then
            exit 1
          fi
          if grep -Eq -- '^-keep[[:space:]]+class[[:space:]]+com\.anurag9000\.forestrun\.\*\*' app/proguard-rules.pro; then
            exit 1
          fi

      - name: Compile debug and release sources
        shell: bash
        run: |
          set +e
          ./gradlew compileDebugKotlin compileDebugUnitTestKotlin compileReleaseKotlin \
            --no-daemon --stacktrace --console=plain > compile.log 2>&1
          status=$?
          if [[ $status -ne 0 ]]; then
            echo '::group::Kotlin compiler diagnostics'
            grep -E '(^e: | error: |FAILURE:|Execution failed for task|\* What went wrong:)' compile.log || true
            echo '::endgroup::'
            tail -n 280 compile.log
          fi
          exit $status

      - name: Run full unit suite
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace --console=plain

      - name: Run debug and release lint
        run: ./gradlew lintDebug lintRelease --no-daemon --stacktrace --console=plain

      - name: Assemble debug and instrumentation APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace --console=plain

      - name: Build minified release bundle
        run: ./gradlew bundleRelease --no-daemon --stacktrace --console=plain

      - name: Verify artifacts and effective shrinking
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          test -s app/build/outputs/mapping/release/mapping.txt
          python3 - <<'PY'
          from pathlib import Path
          mapping = Path('app/build/outputs/mapping/release/mapping.txt')
          for raw in mapping.read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if line.startswith('com.anurag9000.forestrun.') and line.endswith(':') and ' -> ' in line:
                  original, renamed = line[:-1].split(' -> ', 1)
                  if original != renamed:
                      break
          else:
              raise SystemExit('R8 mapping contains no obfuscated Forest Run classes')
          PY

      - name: Commit validated feedback settings
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          git show b6afb5d9093429f8e35073028f6bb2c1706f6c27:.github/workflows/android-validation.yml > .github/workflows/android-validation.yml
          rm scripts/patch_feedback_settings.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add persisted feedback and motion settings'
          git push origin HEAD:agent/fix-core-gameplay-invariants

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feedback-settings-remediation-diagnostics
          path: |
            compile.log
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-release.html
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 7
