name: Android validation

on:
  pull_request:

permissions:
  contents: write

jobs:
  publish:
    name: Publish already-validated ghost persistence
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out fixed remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-core-gameplay-invariants
          fetch-depth: 0

      - name: Apply exact validated transform
        shell: bash
        run: |
          python3 scripts/patch_async_ghost_persistence.py
          grep -q 'AtomicFile' app/src/main/java/com/anurag9000/forestrun/engine/SaveManager.kt
          grep -q 'GhostPersistenceManager.saveBestRunAsync' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          grep -q 'GhostPersistenceManager.loadLatest' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          rm scripts/patch_async_ghost_persistence.py

      - name: Push only validated production source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/anurag9000/forestrun/engine/SaveManager.kt
          git add app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          git add -u scripts/patch_async_ghost_persistence.py
          git commit -m 'perf: persist best-run ghosts off the render thread'
          git push origin HEAD:agent/fix-core-gameplay-invariants
