name: Android validation

on:
  push:
    branches:
      - agent/fix-core-gameplay-invariants
  pull_request:

concurrency:
  group: relationship-remediation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: Apply relationship patch and validate debug/release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-core-gameplay-invariants
          fetch-depth: 0

      - name: Apply outcome-earned relationship progression
        run: python3 scripts/patch_relationship_progression.py

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager 'platforms;android-36' >/dev/null
          status=${PIPESTATUS[1]}
          set -o pipefail
          exit "$status"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Verify production identity and toolchain
        shell: bash
        run: |
          legacy_dotted="com"."yourname"."forest_run"
          legacy_path="com"/"yourname"/"forest_run"
          test -d app/src/main/java/com/anurag9000/forestrun
          test -d app/src/test/java/com/anurag9000/forestrun
          test ! -d "app/src/main/java/$legacy_path"
          if grep -R -F --line-number \
              --exclude=prepare_play_release.py \
              --exclude-dir=.git --exclude-dir=build --exclude-dir=.gradle \
              -e "$legacy_dotted" -e "$legacy_path" .; then
            exit 1
          fi
          grep -q 'applicationId = "com.anurag9000.forestrun"' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts

      - name: Compile debug and release sources
        shell: bash
        run: |
          set +e
          ./gradlew compileDebugKotlin compileDebugUnitTestKotlin compileReleaseKotlin \
            --no-daemon --stacktrace --console=plain > compile.log 2>&1
          status=$?
          if [[ $status -ne 0 ]]; then
            grep -E '(^e: | error: |FAILURE:|Execution failed for task|\* What went wrong:)' compile.log || true
            tail -n 200 compile.log
          fi
          exit $status

      - name: Run full unit suite
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace --console=plain

      - name: Run debug and release lint
        run: ./gradlew lintDebug lintRelease --no-daemon --stacktrace --console=plain

      - name: Assemble debug and instrumentation APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace --console=plain

      - name: Build minified release bundle
        run: ./gradlew bundleRelease --no-daemon --stacktrace --console=plain

      - name: Verify artifacts
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Commit verified relationship semantics
        if: success() && github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          rm scripts/patch_relationship_progression.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/anurag9000/forestrun/engine/RelationshipArcSystem.kt
          git add app/src/main/java/com/anurag9000/forestrun/engine/PersistentMemoryManager.kt
          git add app/src/test/java/com/anurag9000/forestrun/engine/RelationshipProgressionInvariantTest.kt
          git add app/src/test/java/com/anurag9000/forestrun/engine/ReturnMomentsSystemTest.kt
          git add -u scripts/patch_relationship_progression.py
          git commit -m "fix: earn relationship trust through positive outcomes"
          git push origin HEAD:agent/fix-core-gameplay-invariants

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relationship-remediation-diagnostics
          path: |
            compile.log
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-release.html
          if-no-files-found: warn
          retention-days: 7
