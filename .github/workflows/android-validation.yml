name: Android validation

on:
  push:
    branches:
      - agent/fix-core-gameplay-invariants

permissions:
  contents: write

jobs:
  publish:
    name: Publish validated hot-path remediation
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-core-gameplay-invariants
          fetch-depth: 0

      - name: Apply already-validated transform
        run: python3 scripts/patch_hot_path_traversals.py

      - name: Verify transformed source
        shell: bash
        run: |
          grep -q 'var entityIndex = 0' app/src/main/java/com/anurag9000/forestrun/engine/EntityManager.kt
          grep -q 'var orbIndex = 0' app/src/main/java/com/anurag9000/forestrun/systems/SeedOrbManager.kt
          grep -q 'var emitterIndex = 0' app/src/main/java/com/anurag9000/forestrun/systems/ParticleManager.kt
          grep -q 'ArrayList<FlavorText>(MAX_ACTIVE)' app/src/main/java/com/anurag9000/forestrun/ui/FlavorTextManager.kt
          grep -q 'val widestLine: Float' app/src/main/java/com/anurag9000/forestrun/ui/DialogueBubbleManager.kt

      - name: Restore permanent CI and commit
        shell: bash
        run: |
          git show fa7dd42136e2a6b4d1efa52e8cfb17245c711b45:.github/workflows/android-validation.yml > .github/workflows/android-validation.yml
          rm scripts/patch_hot_path_traversals.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: remove iterator churn from frame hot paths'
          git push origin HEAD:agent/fix-core-gameplay-invariants
