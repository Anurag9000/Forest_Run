name: Publish debug scenario script extraction

on:
  pull_request:

permissions:
  contents: write

jobs:
  publish:
    name: Validate and publish debug script controller
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-core-gameplay-invariants
          fetch-depth: 0

      - name: Apply debug script controller integration
        run: python3 scripts/patch_debug_scenario_script_controller.py

      - name: Verify transformed source contracts
        shell: bash
        run: |
          grep -q 'private val debugScenarioScript = DebugScenarioScript()' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          grep -q 'debugScenarioScript.prepare(scenario)' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          grep -q 'debugScenarioScript.advance(gameState.runTimeSeconds)' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          grep -q 'runMode: RunMode = if (encounterDirector == null)' app/src/main/java/com/anurag9000/forestrun/engine/EntityManager.kt
          test -f app/src/test/java/com/anurag9000/forestrun/engine/DebugScenarioScriptTest.kt
          if grep -q -E 'DebugScriptAction|DebugScriptStep|debugScenarioScriptIndex|debugScriptForScenario' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt; then
            echo 'GameView still owns deterministic script internals.'
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager 'platforms;android-36' >/dev/null
          status=${PIPESTATUS[1]}
          set -o pipefail
          exit "$status"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Compile test lint and assemble transformed tree
        run: >-
          ./gradlew
          compileDebugKotlin
          compileDebugUnitTestKotlin
          compileReleaseKotlin
          compileDebugAndroidTestKotlin
          testDebugUnitTest
          lintDebug
          lintRelease
          assembleDebug
          assembleDebugAndroidTest
          --no-daemon
          --stacktrace
          --console=plain

      - name: Commit validated extraction
        shell: bash
        run: |
          rm scripts/patch_debug_scenario_script_controller.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt \
            app/src/main/java/com/anurag9000/forestrun/engine/EntityManager.kt \
            scripts/patch_debug_scenario_script_controller.py
          git commit -m 'arch: extract deterministic debug script controller'
          git push origin HEAD:agent/fix-core-gameplay-invariants
