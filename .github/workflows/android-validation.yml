name: Publish explicit run-mode integration

on:
  pull_request:

permissions:
  contents: write

jobs:
  publish:
    name: Validate and publish run-mode architecture
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-core-gameplay-invariants
          fetch-depth: 0

      - name: Apply explicit run-mode integration
        run: python3 scripts/patch_explicit_run_mode.py

      - name: Verify transformed source contracts
        shell: bash
        run: |
          grep -q 'internal var runMode: RunMode' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          grep -q 'runMode.persistsProgress' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          grep -q 'runMode.recordsGhost' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          grep -q 'runMode.allowsRandomSpawns' app/src/main/java/com/anurag9000/forestrun/engine/EntityManager.kt
          grep -q 'RunMode.PERFORMANCE_PROFILE' app/src/androidTest/java/com/anurag9000/forestrun/HardwarePerformanceProfileTest.kt
          grep -q 'RunMode.SCREENSHOT_CAPTURE' app/src/androidTest/java/com/anurag9000/forestrun/HardwareCoreFlowCaptureTest.kt
          if grep -R -n 'encounterDirector?.isScenarioActive != true' app/src/main/java; then
            echo 'Indirect deterministic side-effect gate remains.'
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager 'platforms;android-36' >/dev/null
          status=${PIPESTATUS[1]}
          set -o pipefail
          exit "$status"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Compile test lint and assemble transformed tree
        run: >-
          ./gradlew
          compileDebugKotlin
          compileDebugUnitTestKotlin
          compileReleaseKotlin
          compileDebugAndroidTestKotlin
          testDebugUnitTest
          lintDebug
          lintRelease
          assembleDebug
          assembleDebugAndroidTest
          --no-daemon
          --stacktrace
          --console=plain

      - name: Commit validated integration
        shell: bash
        run: |
          rm scripts/patch_explicit_run_mode.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt \
            app/src/main/java/com/anurag9000/forestrun/engine/EntityManager.kt \
            app/src/androidTest/java/com/anurag9000/forestrun/HardwareCoreFlowCaptureTest.kt \
            app/src/androidTest/java/com/anurag9000/forestrun/HardwarePerformanceProfileTest.kt \
            scripts/patch_explicit_run_mode.py
          git commit -m 'arch: route deterministic runs through explicit modes'
          git push origin HEAD:agent/fix-core-gameplay-invariants
