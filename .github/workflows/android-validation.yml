name: Connected Android validation

on:
  pull_request:

concurrency:
  group: connected-instrumentation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  connected:
    name: Compile and run connected smoke suite
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-core-gameplay-invariants

      - name: Apply connected-test hardening
        run: python3 scripts/patch_connected_instrumentation.py

      - name: Verify connected-test contracts
        shell: bash
        run: |
          test -f app/src/androidTest/java/com/anurag9000/forestrun/InstrumentationStateReset.kt
          test -f app/src/androidTest/java/com/anurag9000/forestrun/LifecycleSettingsInstrumentedTest.kt
          grep -q 'InstrumentationStateReset.clear(targetContext)' app/src/androidTest/java/com/anurag9000/forestrun/MainActivityInstrumentedTest.kt
          grep -q 'GardenLayoutPlan' app/src/androidTest/java/com/anurag9000/forestrun/MainActivityInstrumentedTest.kt
          grep -q 'SafeContentTransform' app/src/androidTest/java/com/anurag9000/forestrun/MainActivityInstrumentedTest.kt
          grep -q '@LargeTest' app/src/androidTest/java/com/anurag9000/forestrun/HardwareCoreFlowCaptureTest.kt
          grep -q 'pauseResumeReplacesStoppedRenderThreadAndContinuesFrames' app/src/androidTest/java/com/anurag9000/forestrun/LifecycleSettingsInstrumentedTest.kt
          grep -q 'repeatedSingleTaskIntentsReuseActivityAndSwitchDeterministicScenario' app/src/androidTest/java/com/anurag9000/forestrun/LifecycleSettingsInstrumentedTest.kt
          grep -q 'menuFeedbackControlsApplyImmediatelyAndPersistAcrossRecreation' app/src/androidTest/java/com/anurag9000/forestrun/LifecycleSettingsInstrumentedTest.kt
          grep -q 'startupRepairsWrongTypedSaveAndFeedbackValuesBeforeFirstFrame' app/src/androidTest/java/com/anurag9000/forestrun/LifecycleSettingsInstrumentedTest.kt

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Compile and assemble instrumentation artifacts
        shell: bash
        run: |
          set +e
          ./gradlew compileDebugKotlin compileDebugAndroidTestKotlin \
            assembleDebug assembleDebugAndroidTest lintDebug \
            --no-daemon --stacktrace --console=plain > connected-compile.log 2>&1
          status=$?
          if [[ $status -ne 0 ]]; then
            echo '::group::Connected compiler diagnostics'
            grep -E '(^e: | error: |FAILURE:|Execution failed for task|\* What went wrong:)' connected-compile.log || true
            echo '::endgroup::'
            tail -n 320 connected-compile.log
          fi
          exit $status

      - name: Enable KVM access
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected tests on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: >-
            ./gradlew connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.notAnnotation=androidx.test.filters.LargeTest
            --no-daemon --stacktrace --console=plain

      - name: Verify connected reports
        shell: bash
        run: |
          test -d app/build/outputs/androidTest-results/connected/debug
          find app/build/outputs/androidTest-results/connected/debug -type f | grep -q .

      - name: Upload connected diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-instrumentation-diagnostics
          path: |
            connected-compile.log
            app/build/outputs/androidTest-results/connected/debug/
            app/build/reports/androidTests/connected/debug/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
          retention-days: 7
