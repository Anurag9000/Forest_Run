name: Publish versioned ghost persistence

on:
  pull_request:

permissions:
  contents: write

jobs:
  publish:
    name: Validate and publish ghost format v2
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-core-gameplay-invariants
          fetch-depth: 0

      - name: Apply ghost format migration
        run: python3 scripts/patch_ghost_format_v2.py

      - name: Verify transformed source contracts
        shell: bash
        run: |
          grep -q 'GHOST_FILE_MAGIC' app/src/main/java/com/anurag9000/forestrun/engine/SaveManager.kt
          grep -q 'GHOST_FILE_VERSION = 2' app/src/main/java/com/anurag9000/forestrun/engine/SaveManager.kt
          grep -q 'GhostStateCodec.decodeToOrdinal' app/src/main/java/com/anurag9000/forestrun/engine/SaveManager.kt
          grep -q 'Legacy v1 files' app/src/main/java/com/anurag9000/forestrun/engine/SaveManager.kt
          test -f app/src/test/java/com/anurag9000/forestrun/engine/GhostFileFormatTest.kt
          test -f app/src/test/java/com/anurag9000/forestrun/systems/GhostStateCodecTest.kt

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager 'platforms;android-36' >/dev/null
          status=${PIPESTATUS[1]}
          set -o pipefail
          exit "$status"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Compile test lint and assemble transformed tree
        run: >-
          ./gradlew
          compileDebugKotlin
          compileDebugUnitTestKotlin
          compileReleaseKotlin
          compileDebugAndroidTestKotlin
          testDebugUnitTest
          lintDebug
          lintRelease
          assembleDebug
          assembleDebugAndroidTest
          --no-daemon
          --stacktrace
          --console=plain

      - name: Commit validated migration
        shell: bash
        run: |
          rm scripts/patch_ghost_format_v2.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/anurag9000/forestrun/engine/SaveManager.kt \
            scripts/patch_ghost_format_v2.py
          git commit -m 'feat: version ghost persistence format'
          git push origin HEAD:agent/fix-core-gameplay-invariants
