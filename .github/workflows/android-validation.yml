name: Publish collision-probe allocation remediation

on:
  pull_request:

permissions:
  contents: write

jobs:
  publish:
    name: Validate and publish allocation-free collision probes
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-core-gameplay-invariants
          fetch-depth: 0

      - name: Apply collision allocation remediation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/patch_collision_probe_allocations.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'def block(value: str) -> str:\n    return textwrap.dedent(value).lstrip("\\n")\n',
              'def block(value: str, indent: int = 0) -> str:\n'
              '    normalized = textwrap.dedent(value).lstrip("\\n")\n'
              '    return textwrap.indent(normalized, " " * indent) if indent else normalized\n'
          )

          boundaries = [
              ('CHERRY_OLD', 4),
              ('CHERRY_NEW', 8),
              ('VANILLA_OLD', 8),
              ('VANILLA_NEW', 8),
              ('BAMBOO_OLD', 8),
              ('BAMBOO_NEW', 12),
              ('JACARANDA_OLD', 12),
              ('JACARANDA_NEW', 8),
              ('WILLOW_OLD', 8),
              ('WILLOW_NEW', 8),
              ('TEST_CONTENT', 8),
          ]
          previous = 'HELPERS'
          for next_name, indent in boundaries:
              marker = f'\n)\n\n{next_name} = block('
              replacement = f'\n, {indent})\n\n{next_name} = block('
              if text.count(marker) != 1:
                  raise RuntimeError(f'Could not assign indentation for {previous}')
              text = text.replace(marker, replacement, 1)
              previous = next_name

          path.write_text(text, encoding='utf-8')
          PY
          python3 scripts/patch_collision_probe_allocations.py

      - name: Verify transformed source contracts
        shell: bash
        run: |
          grep -q 'protected fun intersectsExpanded' app/src/main/java/com/anurag9000/forestrun/entities/Entity.kt
          grep -q 'per edge helper is equivalent' app/src/test/java/com/anurag9000/forestrun/entities/EntityCollisionGeometryTest.kt
          if grep -R -n -E 'val (mercy|bm|tm|cm) = RectF' app/src/main/java/com/anurag9000/forestrun/entities; then
            echo 'Temporary collision rectangles remain.'
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager 'platforms;android-36' >/dev/null
          status=${PIPESTATUS[1]}
          set -o pipefail
          exit "$status"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Compile and run invariant suite
        run: >-
          ./gradlew
          compileDebugKotlin
          compileDebugUnitTestKotlin
          testDebugUnitTest
          lintDebug
          --no-daemon
          --stacktrace
          --console=plain

      - name: Commit validated source
        shell: bash
        run: |
          rm scripts/patch_collision_probe_allocations.py
          rm -f scripts/collision_probe_publish_trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/anurag9000/forestrun/entities \
            app/src/test/java/com/anurag9000/forestrun/entities/EntityCollisionGeometryTest.kt \
            scripts/patch_collision_probe_allocations.py \
            scripts/collision_probe_publish_trigger.txt
          git commit -m 'perf: remove collision probe RectF allocations'
          git push origin HEAD:agent/fix-core-gameplay-invariants
