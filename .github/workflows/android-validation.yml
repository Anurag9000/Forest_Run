name: Android validation

on:
  push:
    branches:
      - agent/fix-core-gameplay-invariants

concurrency:
  group: render-hot-path-remediation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: Apply and validate render hot-path remediation
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-core-gameplay-invariants
          fetch-depth: 0

      - name: Apply render allocation remediation
        run: python3 scripts/patch_render_hot_path_allocations.py

      - name: Verify transformed hot-path contracts
        shell: bash
        run: |
          grep -q 'resolveParallaxAtmosphereProfile' app/src/main/java/com/anurag9000/forestrun/engine/ParallaxBackground.kt
          grep -q 'dynamicShaderRebuildCountForTest' app/src/main/java/com/anurag9000/forestrun/engine/ParallaxBackground.kt
          grep -q 'resolveRunLightingIdentity' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          grep -q 'BloomPresentation.resolveInto' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          grep -q 'BloomPowerPresentation.resolveInto' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          grep -q 'private val launchCueRect = RectF()' app/src/main/java/com/anurag9000/forestrun/ui/MainMenuScreen.kt
          test -f app/src/test/java/com/anurag9000/forestrun/engine/RenderHotPathReuseTest.kt
          if grep -n 'progressTier(.*intArrayOf' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt; then
            echo 'Per-frame progress threshold arrays remain.'
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app/src/main/java/com/anurag9000/forestrun/engine/ParallaxBackground.kt').read_text()
          hot_start = text.index('    fun draw(canvas: Canvas)')
          hot_end = text.index('    // ── Phase 24: Rich bitmap builder')
          hot = text[hot_start:hot_end]
          if 'buildParallaxAtmosphereProfile(' in hot:
              raise SystemExit('Allocating atmosphere builder remains in Parallax draw path')
          if 'buildRunLightingIdentity(' in hot:
              raise SystemExit('Allocating lighting builder remains in Parallax draw path')
          if 'val glowPaint = Paint()' in hot:
              raise SystemExit('Per-frame horizon Paint allocation remains')
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager 'platforms;android-36' >/dev/null
          status=${PIPESTATUS[1]}
          set -o pipefail
          exit "$status"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Compile debug and release sources
        shell: bash
        run: |
          set +e
          ./gradlew compileDebugKotlin compileDebugUnitTestKotlin compileReleaseKotlin \
            --no-daemon --stacktrace --console=plain > compile.log 2>&1
          status=$?
          if [[ $status -ne 0 ]]; then
            echo '::group::Kotlin compiler diagnostics'
            grep -E '(^e: | error: |FAILURE:|Execution failed for task|\* What went wrong:)' compile.log || true
            echo '::endgroup::'
            tail -n 320 compile.log
          fi
          exit $status

      - name: Run full unit suite
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace --console=plain

      - name: Run debug and release lint
        run: ./gradlew lintDebug lintRelease --no-daemon --stacktrace --console=plain

      - name: Assemble debug and instrumentation APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace --console=plain

      - name: Build minified release bundle
        run: ./gradlew bundleRelease --no-daemon --stacktrace --console=plain

      - name: Verify build artifacts
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          test -s app/build/outputs/mapping/release/mapping.txt

      - name: Commit verified source and tests
        shell: bash
        run: |
          rm scripts/patch_render_hot_path_allocations.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java app/src/test/java scripts/patch_render_hot_path_allocations.py
          git commit -m 'perf: remove recurring render hot-path allocations'
          git push origin HEAD:agent/fix-core-gameplay-invariants

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-hot-path-remediation-diagnostics
          path: |
            compile.log
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-release.html
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 7
