name: Android validation

on:
  push:
    branches:
      - agent/fix-core-gameplay-invariants
  pull_request:

concurrency:
  group: ghost-visibility-allocation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: Remove ghost visibility allocations and validate
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out fixed remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-core-gameplay-invariants
          fetch-depth: 0

      - name: Apply zero-allocation ghost visibility patch
        run: python3 scripts/patch_ghost_visibility_allocations.py

      - name: Verify allocation contract
        shell: bash
        run: |
          grep -q 'private val ghostHazardFocusRect = RectF()' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          grep -q 'private val reusableGhostVisibilityContext' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          grep -q 'ghostHazardFocusRect.set(' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          grep -q 'return reusableGhostVisibilityContext.set(' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          if grep -q 'val focusRect = RectF(' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt; then
            echo 'Per-frame ghost focus RectF allocation remains.'
            exit 1
          fi
          if grep -q 'return GhostPlayer.VisibilityContext(' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt; then
            echo 'Per-frame ghost visibility context allocation remains.'
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager 'platforms;android-36' >/dev/null
          status=${PIPESTATUS[1]}
          set -o pipefail
          exit "$status"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Verify permanent release contracts
        shell: bash
        run: |
          grep -q 'applicationId = "com.anurag9000.forestrun"' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'WindowInsetsCompat.Type.displayCutout()' app/src/main/java/com/anurag9000/forestrun/MainActivity.kt
          grep -q 'safeContentTransform.toLogical' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          if git grep -n -E 'com\.google\.gson|Gson|SerializedName|TypeToken' -- app/src; then
            exit 1
          fi
          if grep -Eq -- '^-keep[[:space:]]+class[[:space:]]+com\.anurag9000\.forestrun\.\*\*' app/proguard-rules.pro; then
            exit 1
          fi

      - name: Compile debug and release sources
        shell: bash
        run: |
          set +e
          ./gradlew compileDebugKotlin compileDebugUnitTestKotlin compileReleaseKotlin \
            --no-daemon --stacktrace --console=plain > compile.log 2>&1
          status=$?
          if [[ $status -ne 0 ]]; then
            grep -E '(^e: | error: |FAILURE:|Execution failed for task|\* What went wrong:)' compile.log || true
            tail -n 240 compile.log
          fi
          exit $status

      - name: Run full unit suite
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace --console=plain

      - name: Run debug and release lint
        run: ./gradlew lintDebug lintRelease --no-daemon --stacktrace --console=plain

      - name: Assemble debug and instrumentation APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace --console=plain

      - name: Build minified release bundle
        run: ./gradlew bundleRelease --no-daemon --stacktrace --console=plain

      - name: Verify artifacts and effective shrinking
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          test -s app/build/outputs/mapping/release/mapping.txt
          python3 - <<'PY'
          from pathlib import Path
          mapping = Path('app/build/outputs/mapping/release/mapping.txt')
          for raw in mapping.read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if line.startswith('com.anurag9000.forestrun.') and line.endswith(':') and ' -> ' in line:
                  original, renamed = line[:-1].split(' -> ', 1)
                  if original != renamed:
                      break
          else:
              raise SystemExit('R8 mapping contains no obfuscated Forest Run classes')
          PY

      - name: Push only validated production source
        if: success()
        shell: bash
        run: |
          rm scripts/patch_ghost_visibility_allocations.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/anurag9000/forestrun/systems/GhostPlayer.kt
          git add app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          git add -u scripts/patch_ghost_visibility_allocations.py
          git commit -m 'perf: reuse ghost visibility objects per frame'
          git push origin HEAD:agent/fix-core-gameplay-invariants

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghost-visibility-allocation-diagnostics
          path: |
            compile.log
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-release.html
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 7
