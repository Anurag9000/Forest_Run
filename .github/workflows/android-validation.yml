name: Publish validated save integrity

on:
  pull_request:

permissions:
  contents: write

jobs:
  publish:
    name: Commit validated save integrity source
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-core-gameplay-invariants
          fetch-depth: 0

      - name: Apply the fully validated transforms
        shell: bash
        run: |
          python3 scripts/patch_save_integrity_existing.py
          python3 scripts/patch_save_integrity_followups.py
          python3 scripts/fix_save_integrity_init_order.py
          grep -q 'SaveIntegrityManager.repair(this)' app/src/main/java/com/anurag9000/forestrun/MainActivity.kt
          grep -q 'context.getSharedPreferences(activePrefsName' app/src/main/java/com/anurag9000/forestrun/engine/SaveManager.kt
          grep -q 'File(context.filesDir, activeGhostFilename)' app/src/main/java/com/anurag9000/forestrun/engine/SaveManager.kt
          grep -q 'requiredLastRunKeys.any' app/src/main/java/com/anurag9000/forestrun/engine/SaveIntegrityManager.kt
          grep -q 'val all = prefs.all' app/src/main/java/com/anurag9000/forestrun/engine/FeedbackSettings.kt

      - name: Commit validated production source
        shell: bash
        run: |
          rm scripts/patch_save_integrity_existing.py
          rm scripts/patch_save_integrity_followups.py
          rm scripts/fix_save_integrity_init_order.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: repair and version persistent save state'
          git push origin HEAD:agent/fix-core-gameplay-invariants
