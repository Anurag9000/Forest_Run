name: Android validation

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

concurrency:
  group: android-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Compile, test, lint, and build debug/release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager 'platforms;android-36' >/dev/null
          status=${PIPESTATUS[1]}
          set -o pipefail
          exit "$status"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Verify production identity and toolchain
        shell: bash
        run: |
          legacy_dotted="com"."yourname"."forest_run"
          legacy_path="com"/"yourname"/"forest_run"
          test -d app/src/main/java/com/anurag9000/forestrun
          test -d app/src/test/java/com/anurag9000/forestrun
          test ! -d "app/src/main/java/$legacy_path"
          if grep -R -F --line-number \
              --exclude=prepare_play_release.py \
              --exclude-dir=.git --exclude-dir=build --exclude-dir=.gradle \
              -e "$legacy_dotted" -e "$legacy_path" .; then
            echo "Placeholder package identity remains outside the intentional release denylist."
            exit 1
          fi
          grep -q 'applicationId = "com.anurag9000.forestrun"' app/build.gradle.kts
          grep -q 'namespace = "com.anurag9000.forestrun"' app/build.gradle.kts
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'org.robolectric:robolectric:4.16' app/build.gradle.kts

      - name: Verify safe-content, allocation, and shrinker hygiene
        shell: bash
        run: |
          grep -q 'WindowInsetsCompat.Type.displayCutout()' app/src/main/java/com/anurag9000/forestrun/MainActivity.kt
          grep -q 'WindowCompat.setDecorFitsSystemWindows(window, false)' app/src/main/java/com/anurag9000/forestrun/MainActivity.kt
          grep -q 'fun setSafeAreaInsets' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          grep -q 'safeContentTransform.toLogical' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          test "$(grep -c 'drawInSafeContent(canvas)' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt)" -ge 5
          grep -q 'private val ghostHazardFocusRect = RectF()' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          grep -q 'private val reusableGhostVisibilityContext' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          grep -q 'return reusableGhostVisibilityContext.set(' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          if grep -q 'val focusRect = RectF(' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt; then
            echo "Per-frame ghost focus RectF allocation returned."
            exit 1
          fi
          if grep -q 'return GhostPlayer.VisibilityContext(' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt; then
            echo "Per-frame ghost visibility context allocation returned."
            exit 1
          fi
          if git grep -n -E 'com\.google\.gson|Gson|SerializedName|TypeToken' -- app/src; then
            echo "Unexpected Gson source usage remains after dependency removal."
            exit 1
          fi
          if grep -q 'com.google.code.gson' app/build.gradle.kts; then
            echo "Unused Gson dependency remains."
            exit 1
          fi
          if grep -Eq -- '^-keep[[:space:]]+class[[:space:]]+com\.anurag9000\.forestrun\.\*\*' app/proguard-rules.pro; then
            echo "Package-wide keep rule still disables meaningful release shrinking."
            exit 1
          fi

      - name: Report packaged sprite dimensions
        run: find app/src/main/assets/sprites -type f -name '*.png' -print0 | sort -z | xargs -0 file | tee sprite-dimensions.txt

      - name: Upload sprite dimension inventory
        uses: actions/upload-artifact@v4
        with:
          name: sprite-dimensions
          path: sprite-dimensions.txt
          if-no-files-found: error
          retention-days: 7

      - name: Compile debug and release sources
        shell: bash
        run: |
          set +e
          ./gradlew compileDebugKotlin compileDebugUnitTestKotlin compileReleaseKotlin \
            --no-daemon --stacktrace --console=plain > compile.log 2>&1
          status=$?
          if [[ $status -ne 0 ]]; then
            echo "::group::Kotlin compiler diagnostics"
            grep -E '(^e: | error: |FAILURE:|Execution failed for task|\* What went wrong:)' compile.log || true
            echo "::endgroup::"
            echo "::group::Final compile log"
            tail -n 200 compile.log
            echo "::endgroup::"
          fi
          exit $status

      - name: Run debug unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace --console=plain

      - name: Run debug and release lint
        run: ./gradlew lintDebug lintRelease --no-daemon --stacktrace --console=plain

      - name: Assemble debug and instrumentation APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace --console=plain

      - name: Build minified release bundle
        run: ./gradlew bundleRelease --no-daemon --stacktrace --console=plain

      - name: Verify build artifacts and effective shrinking
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          test -s app/build/outputs/mapping/release/mapping.txt
          python3 - <<'PY'
          from pathlib import Path

          mapping = Path("app/build/outputs/mapping/release/mapping.txt")
          obfuscated = []
          for raw_line in mapping.read_text(encoding="utf-8").splitlines():
              line = raw_line.strip()
              if not line.startswith("com.anurag9000.forestrun.") or not line.endswith(":") or " -> " not in line:
                  continue
              original, renamed = line[:-1].split(" -> ", 1)
              if original != renamed:
                  obfuscated.append((original, renamed))
          if not obfuscated:
              raise SystemExit("R8 mapping contains no obfuscated Forest Run classes")
          print(f"Verified {len(obfuscated)} obfuscated Forest Run classes")
          PY

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-log
          path: compile.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-release.html
            app/build/reports/lint-results-release.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Upload release mapping
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: forest-run-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload debug APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: forest-run-debug-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload unsigned release bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: forest-run-release-aab-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
