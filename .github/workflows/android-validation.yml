name: Android validation

on:
  push:
    branches:
      - agent/fix-core-gameplay-invariants
  pull_request:

concurrency:
  group: particle-emitter-cache-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: Apply particle cache patch and validate debug/release
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-core-gameplay-invariants
          fetch-depth: 0

      - name: Apply allocation-free one-shot emitter cache
        run: python3 scripts/patch_particle_emitter_cache.py

      - name: Verify transformed source contract
        shell: bash
        run: |
          grep -q 'oneShotEmitterCache = arrayOfNulls' app/src/main/java/com/anurag9000/forestrun/systems/ParticleManager.kt
          grep -q 'cachedOneShotEmitterForTest' app/src/main/java/com/anurag9000/forestrun/systems/ParticleManager.kt
          grep -q 'continuous preset used one shot is cached' app/src/test/java/com/anurag9000/forestrun/systems/ParticleEmitterCacheTest.kt
          if grep -q 'val emitter = preset.build(x, y)' app/src/main/java/com/anurag9000/forestrun/systems/ParticleManager.kt; then
            echo 'Event-time named emitter allocation remains.'
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager 'platforms;android-36' >/dev/null
          status=${PIPESTATUS[1]}
          set -o pipefail
          exit "$status"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Compile debug, release, and instrumentation sources
        shell: bash
        run: |
          set +e
          ./gradlew compileDebugKotlin compileDebugUnitTestKotlin compileReleaseKotlin \
            compileDebugAndroidTestKotlin --no-daemon --stacktrace --console=plain \
            > compile.log 2>&1
          status=$?
          if [[ $status -ne 0 ]]; then
            echo '::group::Compiler diagnostics'
            grep -E '(^e: | error: |FAILURE:|Execution failed for task|\* What went wrong:)' compile.log || true
            echo '::endgroup::'
            tail -n 300 compile.log
          fi
          exit $status

      - name: Run full unit suite
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace --console=plain

      - name: Run debug and release lint
        run: ./gradlew lintDebug lintRelease --no-daemon --stacktrace --console=plain

      - name: Assemble debug and instrumentation APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace --console=plain

      - name: Build minified release bundle
        run: ./gradlew bundleRelease --no-daemon --stacktrace --console=plain

      - name: Verify build artifacts
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          test -s app/build/outputs/mapping/release/mapping.txt

      - name: Commit verified particle cache
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          git show HEAD^:.github/workflows/android-validation.yml > .github/workflows/android-validation.yml
          rm scripts/patch_particle_emitter_cache.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: reuse one-shot particle emitters'
          git push origin HEAD:agent/fix-core-gameplay-invariants

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: particle-emitter-cache-diagnostics
          path: |
            compile.log
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-release.html
          if-no-files-found: warn
          retention-days: 7
