name: Publish reconciled release checklist

on:
  pull_request:

permissions:
  contents: write

jobs:
  publish:
    name: Commit reconciled release documentation
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-core-gameplay-invariants
          fetch-depth: 0

      - name: Reconcile validated checklist items
        shell: bash
        run: |
          python3 scripts/reconcile_release_checklist.py
          grep -q 'Reduced-motion, audio, and haptic preferences persist' docs/RELEASE.md
          grep -q 'Save state is schema-versioned' docs/RELEASE.md
          grep -q 'Future-schema preference and ghost preservation' docs/RELEASE.md
          if grep -q 'Add reduced-motion, audio, and haptic user settings' docs/RELEASE.md; then
            exit 1
          fi
          if grep -q 'Add broader SharedPreferences save-corruption and migration fixtures' docs/RELEASE.md; then
            exit 1
          fi

      - name: Commit documentation truth
        shell: bash
        run: |
          rm scripts/reconcile_release_checklist.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: reconcile validated release status'
          git push origin HEAD:agent/fix-core-gameplay-invariants
