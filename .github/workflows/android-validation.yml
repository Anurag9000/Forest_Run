name: Android validation

on:
  push:
    branches:
      - agent/fix-core-gameplay-invariants
  pull_request:

concurrency:
  group: ghost-persistence-remediation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: Apply ghost patch and validate debug/release
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-core-gameplay-invariants
          fetch-depth: 0

      - name: Apply asynchronous atomic ghost persistence
        run: python3 scripts/patch_async_ghost_persistence.py

      - name: Verify transformed source contract
        shell: bash
        run: |
          grep -q 'AtomicFile' app/src/main/java/com/anurag9000/forestrun/engine/SaveManager.kt
          grep -q 'GhostPersistenceManager.saveBestRunAsync' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          grep -q 'GhostPersistenceManager.loadLatest' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          grep -q 'detachSnapshot' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          if grep -q 'SaveManager.saveGhostRun(context, ghostRecorder' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt; then
            echo 'Synchronous render-thread ghost save remains.'
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager 'platforms;android-36' >/dev/null
          status=${PIPESTATUS[1]}
          set -o pipefail
          exit "$status"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Compile debug and release sources
        shell: bash
        run: |
          set +e
          ./gradlew compileDebugKotlin compileDebugUnitTestKotlin compileReleaseKotlin \
            --no-daemon --stacktrace --console=plain > compile.log 2>&1
          status=$?
          if [[ $status -ne 0 ]]; then
            echo '::group::Kotlin compiler diagnostics'
            grep -E '(^e: | error: |FAILURE:|Execution failed for task|\* What went wrong:)' compile.log || true
            echo '::endgroup::'
            tail -n 240 compile.log
          fi
          exit $status

      - name: Run full unit suite
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace --console=plain

      - name: Run debug and release lint
        run: ./gradlew lintDebug lintRelease --no-daemon --stacktrace --console=plain

      - name: Assemble debug and instrumentation APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace --console=plain

      - name: Build minified release bundle
        run: ./gradlew bundleRelease --no-daemon --stacktrace --console=plain

      - name: Verify build artifacts
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Commit verified ghost persistence
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          git show 7b4b4e0b67d46d4d0ab2ae29c225b3155e744733:.github/workflows/android-validation.yml > .github/workflows/android-validation.yml
          rm scripts/patch_async_ghost_persistence.py
          rm -f .github/workflows/commit-ghost-remediation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: persist best-run ghosts off the render thread'
          git push origin HEAD:agent/fix-core-gameplay-invariants

      - name: Upload validated source and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghost-persistence-remediation-diagnostics
          path: |
            app/src/main/java/com/anurag9000/forestrun/engine/SaveManager.kt
            app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
            compile.log
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-release.html
          if-no-files-found: warn
          retention-days: 7
