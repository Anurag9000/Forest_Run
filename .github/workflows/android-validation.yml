name: Publish validated render-thread shutdown

on:
  pull_request:

permissions:
  contents: write

jobs:
  publish:
    name: Commit validated shutdown boundary
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-core-gameplay-invariants
          fetch-depth: 0

      - name: Apply fully validated shutdown transform
        shell: bash
        run: |
          python3 scripts/patch_game_thread_shutdown.py
          python3 scripts/fix_game_thread_constructor.py
          grep -q 'internal fun requestStopAndAwait' app/src/main/java/com/anurag9000/forestrun/engine/GameThread.kt
          grep -q 'gameThread.requestStopAndAwait()' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          test -f app/src/test/java/com/anurag9000/forestrun/engine/GameThreadShutdownTest.kt
          if grep -q 'Add a deterministic interruption test around the real' docs/RELEASE.md; then
            exit 1
          fi

      - name: Commit validated production source
        shell: bash
        run: |
          rm scripts/patch_game_thread_shutdown.py
          rm scripts/fix_game_thread_constructor.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: validate the real render-thread shutdown boundary'
          git push origin HEAD:agent/fix-core-gameplay-invariants
