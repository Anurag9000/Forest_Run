name: Android validation

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: android-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host:
    name: Compile, test, lint, and build debug/release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager 'platforms;android-36' >/dev/null
          status=${PIPESTATUS[1]}
          set -o pipefail
          exit "$status"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Verify audited source contracts
        shell: bash
        run: |
          legacy_dotted="com"."yourname"."forest_run"
          legacy_path="com"/"yourname"/"forest_run"
          test -d app/src/main/java/com/anurag9000/forestrun
          test -d app/src/test/java/com/anurag9000/forestrun
          test -d app/src/androidTest/java/com/anurag9000/forestrun
          test ! -d "app/src/main/java/$legacy_path"
          if grep -R -F --line-number \
              --exclude=prepare_play_release.py \
              --exclude-dir=.git --exclude-dir=build --exclude-dir=.gradle \
              -e "$legacy_dotted" -e "$legacy_path" .; then
            echo "Placeholder package identity remains."
            exit 1
          fi

          grep -q 'applicationId = "com.anurag9000.forestrun"' app/build.gradle.kts
          grep -q 'namespace = "com.anurag9000.forestrun"' app/build.gradle.kts
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'org.robolectric:robolectric:4.16' app/build.gradle.kts

          grep -q 'internal fun requestStopAndAwait' app/src/main/java/com/anurag9000/forestrun/engine/GameThread.kt
          grep -q 'gameThread.requestStopAndAwait()' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          test -f app/src/test/java/com/anurag9000/forestrun/engine/GameThreadShutdownTest.kt

          grep -q 'safeContentTransform.toLogical' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          grep -q 'GhostPersistenceManager.saveBestRunAsync' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          grep -q 'GhostPersistenceManager.loadLatest' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          grep -q 'AtomicFile' app/src/main/java/com/anurag9000/forestrun/engine/SaveManager.kt

          grep -q 'SaveIntegrityManager.repair(this)' app/src/main/java/com/anurag9000/forestrun/MainActivity.kt
          grep -q 'CURRENT_SCHEMA_VERSION = 1' app/src/main/java/com/anurag9000/forestrun/engine/SaveIntegrityManager.kt
          grep -q 'useCompatibilityPreferences' app/src/main/java/com/anurag9000/forestrun/engine/SaveManager.kt
          grep -q 'ghost_run_compat_v' app/src/main/java/com/anurag9000/forestrun/engine/SaveManager.kt
          grep -q 'current == Int.MAX_VALUE' app/src/main/java/com/anurag9000/forestrun/engine/SaveManager.kt

          grep -q 'FeedbackSettings.init(this)' app/src/main/java/com/anurag9000/forestrun/MainActivity.kt
          grep -q 'FeedbackSettings.hapticsEnabled' app/src/main/java/com/anurag9000/forestrun/engine/HapticManager.kt
          grep -q 'FeedbackSettings.audioEnabled' app/src/main/java/com/anurag9000/forestrun/engine/SfxManager.kt
          grep -q 'FeedbackSettings.reducedMotion' app/src/main/java/com/anurag9000/forestrun/engine/CameraSystem.kt
          grep -q 'feedbackSettingsPanel.onTap' app/src/main/java/com/anurag9000/forestrun/ui/MainMenuScreen.kt

          test ! -e scripts/patch_connected_instrumentation.py
          if grep -R -n 'org.junit.Ignore' app/src/androidTest; then
            echo 'Connected test source contains an ignored test.'
            exit 1
          fi
          grep -q 'GhostPersistenceManager.awaitPendingWrites' app/src/androidTest/java/com/anurag9000/forestrun/MainActivityInstrumentedTest.kt
          grep -q '@LargeTest' app/src/androidTest/java/com/anurag9000/forestrun/HardwareCoreFlowCaptureTest.kt

          if git grep -n -E 'com\.google\.gson|Gson|SerializedName|TypeToken' -- app/src; then
            echo 'Gson references remain in app source.'
            exit 1
          fi
          if grep -Eq -- '^-keep[[:space:]]+class[[:space:]]+com\.anurag9000\.forestrun\.\*\*' app/proguard-rules.pro; then
            echo 'Broad application keep rule defeats release shrinking.'
            exit 1
          fi

      - name: Report packaged sprite dimensions
        run: find app/src/main/assets/sprites -type f -name '*.png' -print0 | sort -z | xargs -0 file | tee sprite-dimensions.txt

      - name: Compile debug and release sources
        shell: bash
        run: |
          set +e
          ./gradlew compileDebugKotlin compileDebugUnitTestKotlin compileReleaseKotlin \
            --no-daemon --stacktrace --console=plain > compile.log 2>&1
          status=$?
          if [[ $status -ne 0 ]]; then
            echo '::group::Kotlin compiler diagnostics'
            grep -E '(^e: | error: |FAILURE:|Execution failed for task|\* What went wrong:)' compile.log || true
            echo '::endgroup::'
            tail -n 300 compile.log
          fi
          exit $status

      - name: Run debug unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace --console=plain

      - name: Run debug and release lint
        run: ./gradlew lintDebug lintRelease --no-daemon --stacktrace --console=plain

      - name: Assemble debug and instrumentation APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace --console=plain

      - name: Build minified release bundle
        run: ./gradlew bundleRelease --no-daemon --stacktrace --console=plain

      - name: Verify build artifacts and effective shrinking
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          test -s app/build/outputs/mapping/release/mapping.txt
          python3 - <<'PY'
          from pathlib import Path

          mapping = Path('app/build/outputs/mapping/release/mapping.txt')
          for raw in mapping.read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if line.startswith('com.anurag9000.forestrun.') and line.endswith(':') and ' -> ' in line:
                  original, renamed = line[:-1].split(' -> ', 1)
                  if original != renamed:
                      break
          else:
              raise SystemExit('R8 mapping contains no obfuscated Forest Run classes')
          PY

      - name: Upload host validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-host-validation-diagnostics
          path: |
            compile.log
            sprite-dimensions.txt
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-release.html
            app/build/reports/lint-results-release.xml
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload debug APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: forest-run-debug-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload unsigned release bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: forest-run-release-aab-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

  connected:
    name: Run fourteen zero-skipped connected tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify connected-test source contracts
        shell: bash
        run: |
          test -f app/src/androidTest/java/com/anurag9000/forestrun/InstrumentationStateReset.kt
          test -f app/src/androidTest/java/com/anurag9000/forestrun/LifecycleSettingsInstrumentedTest.kt
          test -f app/src/androidTest/java/com/anurag9000/forestrun/MainActivityInstrumentedTest.kt
          test -f app/src/androidTest/java/com/anurag9000/forestrun/HardwareCoreFlowCaptureTest.kt
          grep -q 'InstrumentationStateReset.clear(targetContext)' app/src/androidTest/java/com/anurag9000/forestrun/MainActivityInstrumentedTest.kt
          grep -q 'GardenLayoutPlan' app/src/androidTest/java/com/anurag9000/forestrun/MainActivityInstrumentedTest.kt
          grep -q 'SafeContentTransform' app/src/androidTest/java/com/anurag9000/forestrun/MainActivityInstrumentedTest.kt
          grep -q 'GhostPersistenceManager.awaitPendingWrites' app/src/androidTest/java/com/anurag9000/forestrun/MainActivityInstrumentedTest.kt
          grep -q '@LargeTest' app/src/androidTest/java/com/anurag9000/forestrun/HardwareCoreFlowCaptureTest.kt
          if grep -R -n 'org.junit.Ignore' app/src/androidTest; then
            echo 'Connected test source contains an ignored test.'
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Compile and assemble instrumentation artifacts
        shell: bash
        run: |
          set +e
          ./gradlew compileDebugKotlin compileDebugAndroidTestKotlin \
            assembleDebug assembleDebugAndroidTest lintDebug \
            --no-daemon --stacktrace --console=plain > connected-compile.log 2>&1
          status=$?
          if [[ $status -ne 0 ]]; then
            echo '::group::Connected compiler diagnostics'
            grep -E '(^e: | error: |FAILURE:|Execution failed for task|\* What went wrong:)' connected-compile.log || true
            echo '::endgroup::'
            tail -n 320 connected-compile.log
          fi
          exit $status

      - name: Enable KVM access
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected tests on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: >-
            ./gradlew connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.notAnnotation=androidx.test.filters.LargeTest
            --no-daemon --stacktrace --console=plain

      - name: Verify fourteen zero-skipped connected tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          result_dir = Path('app/build/outputs/androidTest-results/connected/debug')
          reports = sorted(result_dir.glob('TEST-*.xml'))
          if len(reports) != 1:
              raise SystemExit(f'Expected exactly one connected JUnit report, found {len(reports)}')

          root = ET.parse(reports[0]).getroot()
          if root.tag != 'testsuite':
              raise SystemExit(f'Unexpected connected report root: {root.tag}')

          totals = {key: int(root.attrib.get(key, '0')) for key in ('tests', 'failures', 'errors', 'skipped')}
          cases = root.findall('testcase')
          print(f'connected report={reports[0]} totals={totals} testcase_count={len(cases)}')
          if totals['tests'] != 14 or len(cases) != 14:
              raise SystemExit(f'Expected exactly 14 connected tests, got totals={totals}, cases={len(cases)}')
          if any(totals[key] != 0 for key in ('failures', 'errors', 'skipped')):
              raise SystemExit(f'Connected suite is not fully green: {totals}')
          PY

      - name: Upload connected diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-instrumentation-diagnostics
          path: |
            connected-compile.log
            app/build/outputs/androidTest-results/connected/debug/
            app/build/reports/androidTests/connected/debug/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
          retention-days: 7
