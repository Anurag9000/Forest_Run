name: One-shot debug persistence isolation

on:
  push:
    branches:
      - agent/fix-core-gameplay-invariants

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-core-gameplay-invariants
          fetch-depth: 0

      - name: Apply debug persistence patch
        run: python3 scripts/patch_debug_persistence_isolation.py

      - name: Commit patched source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Debug persistence isolation is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/yourname/forest_run/engine/EntityManager.kt
          git add app/src/main/java/com/yourname/forest_run/engine/GameView.kt
          git add app/src/main/java/com/yourname/forest_run/entities/animals/Cat.kt
          git commit -m "fix: isolate deterministic scenarios from persistence"
          git push origin HEAD:agent/fix-core-gameplay-invariants
