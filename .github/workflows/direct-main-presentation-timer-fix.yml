name: Direct-main presentation timer hardening

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/direct-main-presentation-timer-fix.yml

permissions:
  contents: write

concurrency:
  group: direct-main-presentation-timer-hardening
  cancel-in-progress: false

jobs:
  patch-validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Apply exact presentation timer hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          helper = Path("app/src/main/java/com/anurag9000/forestrun/ui/PresentationFrameTime.kt")
          helper.write_text(
              '''package com.anurag9000.forestrun.ui

/**
 * Normalizes frame deltas used only by presentation-layer animation clocks.
 *
 * The render thread already caps production deltas, but these UI owners are also
 * called directly by tests, debug tooling, and lifecycle transitions. Failing
 * closed here prevents one malformed value from permanently poisoning animation
 * state with NaN or infinity.
 */
internal const val MAX_PRESENTATION_FRAME_DELTA_SECONDS = 0.05f

internal fun sanitizePresentationFrameDelta(deltaTime: Float): Float {
    if (!deltaTime.isFinite() || deltaTime <= 0f) return 0f
    return deltaTime.coerceAtMost(MAX_PRESENTATION_FRAME_DELTA_SECONDS)
}
''',
              encoding="utf-8",
          )

          replace_exact(
              "app/src/main/java/com/anurag9000/forestrun/ui/MainMenuScreen.kt",
              '''    fun update(deltaTime: Float) {
        elapsedT += deltaTime
        willowSprite.update(deltaTime)
        birdSprite.update(deltaTime)

        if (phase == Phase.STANDING_UP) {
            standTimer += deltaTime
            standPlayerSprite.update(deltaTime)
            if (standTimer >= STAND_DURATION || standPlayerSprite.isFinished) {
                phase = Phase.READY
            }
        }
        if (phase == Phase.READY) readyPlayerSprite.update(deltaTime)
    }
''',
              '''    fun update(deltaTime: Float) {
        val dt = sanitizePresentationFrameDelta(deltaTime)
        if (dt <= 0f) return

        elapsedT += dt
        willowSprite.update(dt)
        birdSprite.update(dt)

        if (phase == Phase.STANDING_UP) {
            standTimer += dt
            standPlayerSprite.update(dt)
            if (standTimer >= STAND_DURATION || standPlayerSprite.isFinished) {
                phase = Phase.READY
            }
        }
        if (phase == Phase.READY) readyPlayerSprite.update(dt)
    }
''',
          )

          replace_exact(
              "app/src/main/java/com/anurag9000/forestrun/ui/GameOverScreen.kt",
              '''    fun update(deltaTime: Float) {
        pulseTimer += deltaTime
    }
''',
              '''    fun update(deltaTime: Float) {
        val dt = sanitizePresentationFrameDelta(deltaTime)
        if (dt <= 0f) return
        pulseTimer += dt
    }
''',
          )

          replace_exact(
              "app/src/main/java/com/anurag9000/forestrun/ui/HUD.kt",
              '''    fun update(deltaTime: Float, state: GameStateManager) {
        val dt = deltaTime

        // Smooth fill lerp toward actual bloom meter value
''',
              '''    fun update(deltaTime: Float, state: GameStateManager) {
        val dt = sanitizePresentationFrameDelta(deltaTime)
        if (dt <= 0f) return

        // Smooth fill lerp toward actual bloom meter value
''',
          )

          test = Path("app/src/test/java/com/anurag9000/forestrun/ui/PresentationFrameTimeTest.kt")
          test.parent.mkdir(parents=True, exist_ok=True)
          test.write_text(
              '''package com.anurag9000.forestrun.ui

import org.junit.Assert.assertEquals
import org.junit.Test

class PresentationFrameTimeTest {
    @Test
    fun `ordinary positive delta is preserved`() {
        assertEquals(0.016f, sanitizePresentationFrameDelta(0.016f), 0f)
    }

    @Test
    fun `oversized positive delta is capped`() {
        assertEquals(
            MAX_PRESENTATION_FRAME_DELTA_SECONDS,
            sanitizePresentationFrameDelta(10f),
            0f
        )
    }

    @Test
    fun `non positive and non finite deltas fail closed`() {
        listOf(
            0f,
            -0.001f,
            Float.NaN,
            Float.POSITIVE_INFINITY,
            Float.NEGATIVE_INFINITY
        ).forEach { invalid ->
            assertEquals(0f, sanitizePresentationFrameDelta(invalid), 0f)
        }
    }
}
''',
              encoding="utf-8",
          )
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager 'platforms;android-36' >/dev/null
          status=${PIPESTATUS[1]}
          set -o pipefail
          exit "$status"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile and run presentation timer tests
        run: >-
          ./gradlew
          compileDebugKotlin
          compileDebugUnitTestKotlin
          testDebugUnitTest
          --tests com.anurag9000.forestrun.ui.PresentationFrameTimeTest
          --no-daemon
          --stacktrace
          --console=plain

      - name: Commit directly to main and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/direct-main-presentation-timer-fix.yml
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git add app/src/main/java/com/anurag9000/forestrun/ui/MainMenuScreen.kt \
                  app/src/main/java/com/anurag9000/forestrun/ui/GameOverScreen.kt \
                  app/src/main/java/com/anurag9000/forestrun/ui/HUD.kt \
                  app/src/main/java/com/anurag9000/forestrun/ui/PresentationFrameTime.kt \
                  app/src/test/java/com/anurag9000/forestrun/ui/PresentationFrameTimeTest.kt \
                  .github/workflows/direct-main-presentation-timer-fix.yml
          git commit -m 'Harden presentation frame-time ownership'
          git push origin HEAD:main
