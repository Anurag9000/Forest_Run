name: Publish collision-probe allocation fix

on:
  push:
    branches:
      - agent/fix-core-gameplay-invariants

permissions:
  contents: write

jobs:
  publish:
    name: Validate and commit allocation-free collision probes
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-core-gameplay-invariants
          fetch-depth: 0

      - name: Apply collision allocation remediation
        run: python3 scripts/patch_collision_probe_allocations.py

      - name: Verify transformed source contracts
        shell: bash
        run: |
          grep -q 'protected fun intersectsExpanded' app/src/main/java/com/anurag9000/forestrun/entities/Entity.kt
          grep -q 'asymmetric expansion preserves Cherry gust geometry' app/src/test/java/com/anurag9000/forestrun/entities/EntityCollisionGeometryTest.kt
          if grep -R -n -E 'val (mercy|bm|tm) = RectF' app/src/main/java/com/anurag9000/forestrun/entities; then
            echo 'Temporary collision rectangles remain.'
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager 'platforms;android-36' >/dev/null
          status=${PIPESTATUS[1]}
          set -o pipefail
          exit "$status"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Compile and run invariant suite
        run: >-
          ./gradlew
          compileDebugKotlin
          compileDebugUnitTestKotlin
          testDebugUnitTest
          lintDebug
          --no-daemon
          --stacktrace
          --console=plain

      - name: Commit validated source
        shell: bash
        run: |
          rm scripts/patch_collision_probe_allocations.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/anurag9000/forestrun/entities \
            app/src/test/java/com/anurag9000/forestrun/entities/EntityCollisionGeometryTest.kt \
            scripts/patch_collision_probe_allocations.py
          git commit -m 'perf: remove collision probe RectF allocations'
          git push origin HEAD:agent/fix-core-gameplay-invariants
