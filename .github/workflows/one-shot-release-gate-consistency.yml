name: One-shot release gate consistency

on:
  push:
    branches:
      - agent/fix-core-gameplay-invariants

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-core-gameplay-invariants
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install release-script dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Apply release gate corrections
        run: |
          python scripts/patch_release_gate_consistency.py
          python -m py_compile scripts/prepare_play_release.py

      - name: Verify corrected release contracts
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          import os
          from pathlib import Path

          path = Path('scripts/prepare_play_release.py')
          spec = importlib.util.spec_from_file_location('prepare_play_release', path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          build_text = Path('app/build.gradle.kts').read_text(encoding='utf-8')
          identity = module.verify_project_identity(build_text, allow_placeholder_id=False)
          assert identity['application_id'] == 'com.anurag9000.forestrun'
          assert identity['compile_sdk'] == 36
          assert identity['target_sdk'] == 36

          for optional in ('sfx_bloom_ready', 'sfx_bloom_convert', 'sfx_bloom_fade'):
              assert optional not in module.REQUIRED_AUDIO

          for name in (
              'FOREST_RUN_KEYSTORE',
              'FOREST_RUN_STORE_PASSWORD',
              'FOREST_RUN_KEY_ALIAS',
              'FOREST_RUN_KEY_PASSWORD',
          ):
              os.environ.pop(name, None)

          module.verify_release_signing(build_text, allow_unsigned=True)
          try:
              module.verify_release_signing(build_text, allow_unsigned=False)
          except SystemExit as exc:
              assert 'credentials are missing' in str(exc)
          else:
              raise AssertionError('Unsigned default release gate unexpectedly passed')
          PY

      - name: Commit corrected release gate
        shell: bash
        run: |
          rm scripts/patch_release_gate_consistency.py
          rm .github/workflows/one-shot-release-gate-consistency.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/prepare_play_release.py
          git add -u scripts/patch_release_gate_consistency.py
          git add -u .github/workflows/one-shot-release-gate-consistency.yml
          git commit -m "fix: make Play release gate match production contracts"
          git push origin HEAD:agent/fix-core-gameplay-invariants
