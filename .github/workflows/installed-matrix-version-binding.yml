name: Installed identity matrix version binding migration

on:
  push:
    branches: [main]
    paths:
      - scripts/migrate_installed_matrix_version_binding.py
      - .github/workflows/installed-matrix-version-binding.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Apply exact version binding
        run: python3 scripts/migrate_installed_matrix_version_binding.py
      - name: Verify focused version contract
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 -m unittest discover -s scripts -p 'test_installed_identity_matrix.py'
          test ! -e scripts/migrate_installed_matrix_version_binding.py
          test ! -e .github/workflows/installed-matrix-version-binding.yml
          grep -q 'version_code: int' scripts/validate_installed_identity_matrix.py
          grep -q 'candidate.version_code does not match installed identity matrix' scripts/validate_play_delivery_evidence.py
      - name: Commit descendant to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'forest-run-migration-bot'
          git config user.email 'forest-run-migration-bot@users.noreply.github.com'
          git add -A
          git commit -m 'fix(release): bind installed matrix version code'
          git push origin HEAD:main
