name: Apply GameView collision adapter

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_gameview_collision_adapter.py
      - .github/workflows/apply-gameview-collision-adapter.yml

permissions:
  contents: write

concurrency:
  group: gameview-collision-adapter-main
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact-marker migration
        run: |
          git fetch origin main
          git reset --hard origin/main
          python3 scripts/apply_gameview_collision_adapter.py
          python3 scripts/apply_gameview_collision_adapter.py --check
          git diff --check

      - name: Commit directly to main and remove migration capability
        run: |
          rm scripts/apply_gameview_collision_adapter.py
          rm .github/workflows/apply-gameview-collision-adapter.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(collision): adopt shared live effect adapter"
          git pull --rebase origin main
          git push origin HEAD:main
