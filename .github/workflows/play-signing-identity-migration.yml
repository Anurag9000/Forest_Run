name: Play signing identity migration

on:
  push:
    branches: [main]
    paths:
      - scripts/migrate_play_signing_identity.py
      - .github/workflows/play-signing-identity-migration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Apply exact signing migration
        run: python3 scripts/migrate_play_signing_identity.py
      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir -r scripts/requirements-ci.txt
      - name: Verify migrated evidence stack
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 -m unittest discover -s scripts -p 'test_*.py'
          test ! -e scripts/migrate_play_signing_identity.py
          test ! -e .github/workflows/play-signing-identity-migration.yml
          grep -q 'upload_certificate_sha256' scripts/validate_device_acceptance.py
          grep -q 'app_signing_certificate_sha256' scripts/validate_device_acceptance.py
          grep -q 'upload_certificate_sha256' scripts/validate_human_acceptance.py
          grep -q 'app_signing_certificate_sha256' scripts/validate_release_governance.py
          grep -q 'app_signing_certificate_sha256' scripts/validate_release_readiness.py
      - name: Commit descendant to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'forest-run-migration-bot'
          git config user.email 'forest-run-migration-bot@users.noreply.github.com'
          git add -A
          git commit -m 'fix(signing): separate upload and app signing identities'
          git push origin HEAD:main
