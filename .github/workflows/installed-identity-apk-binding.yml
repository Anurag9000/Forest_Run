name: Installed identity APK binding migration

on:
  push:
    branches: [main]
    paths:
      - scripts/migrate_installed_identity_apk_binding.py
      - .github/workflows/installed-identity-apk-binding.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Apply exact APK binding hardening
        run: python3 scripts/migrate_installed_identity_apk_binding.py
      - name: Verify installed identity layer
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 -m unittest discover -s scripts -p 'test_installed_candidate_identity.py'
          test ! -e scripts/migrate_installed_identity_apk_binding.py
          test ! -e .github/workflows/installed-identity-apk-binding.yml
          grep -q 'does not match pulled APK evidence' scripts/validate_installed_candidate_identity.py
      - name: Commit descendant to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'forest-run-migration-bot'
          git config user.email 'forest-run-migration-bot@users.noreply.github.com'
          git add -A
          git commit -m 'fix(release): bind installed APK evidence'
          git push origin HEAD:main
