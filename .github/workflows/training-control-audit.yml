name: Training-control applicability audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: training-control-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-trainable-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Compile local applicability authority
        run: >-
          python -m py_compile
          run_all_training.py
          training_control/forest_no_trainable_authority.py
          training_control/dataset_cohort_not_applicable_v1.py
      - name: Certify no retained trainable surface
        run: python run_all_training.py --training-control-audit
      - name: Upload applicability certificate
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: training-control-certificate-${{ github.sha }}
          path: .training_control/coverage_report.json
          if-no-files-found: warn
          retention-days: 30
