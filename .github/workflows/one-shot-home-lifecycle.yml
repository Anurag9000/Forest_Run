name: One-shot home lifecycle remediation

on:
  push:
    branches:
      - agent/fix-core-gameplay-invariants

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-core-gameplay-invariants
          fetch-depth: 0

      - name: Apply audited home lifecycle patch
        run: python3 scripts/patch_home_lifecycle.py

      - name: Commit patched source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Home lifecycle source already matches the audited patch."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/yourname/forest_run/engine/ReturnMomentsSystem.kt
          git add app/src/main/java/com/yourname/forest_run/engine/GardenSanctuaryPlanner.kt
          git add app/src/main/java/com/yourname/forest_run/engine/GameView.kt
          git add app/src/main/java/com/yourname/forest_run/ui/GardenScreen.kt
          git add app/src/main/java/com/yourname/forest_run/ui/MainMenuScreen.kt
          git add app/src/main/java/com/yourname/forest_run/ui/GameOverScreen.kt
          git commit -m "fix: repair home lifecycle and cache rest composition"
          git push origin HEAD:agent/fix-core-gameplay-invariants
