name: Collision purity audit

on:
  push:
    branches:
      - agent/fix-core-gameplay-invariants

permissions:
  contents: write

jobs:
  inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/fix-core-gameplay-invariants
          fetch-depth: 0

      - name: Extract entity collision methods
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('app/src/main/java/com/yourname/forest_run/entities')
          out = []
          for path in sorted(root.rglob('*.kt')):
              text = path.read_text(encoding='utf-8')
              marker = 'override fun onCollision('
              start = 0
              while True:
                  index = text.find(marker, start)
                  if index < 0:
                      break
                  line_start = text.rfind('\n', 0, index) + 1
                  brace = text.find('{', index)
                  if brace < 0:
                      break
                  depth = 0
                  end = brace
                  in_string = False
                  escaped = False
                  for pos in range(brace, len(text)):
                      ch = text[pos]
                      if in_string:
                          if escaped:
                              escaped = False
                          elif ch == '\\':
                              escaped = True
                          elif ch == '"':
                              in_string = False
                          continue
                      if ch == '"':
                          in_string = True
                      elif ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              end = pos + 1
                              break
                  out.append(f'===== {path} =====\n{text[line_start:end].rstrip()}\n')
                  start = end

          target = Path('audit/collision-methods.txt')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text('\n'.join(out), encoding='utf-8')
          print(f'Extracted {len(out)} collision methods')
          PY

      - name: Commit collision inventory
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/collision-methods.txt
          if git diff --cached --quiet; then
            echo "Collision inventory already current."
            exit 0
          fi
          git commit -m "chore: publish collision purity inventory"
          git push origin HEAD:agent/fix-core-gameplay-invariants
