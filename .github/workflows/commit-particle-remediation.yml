name: Commit particle remediation

on:
  push:
    branches:
      - agent/fix-core-gameplay-invariants

permissions:
  contents: write

jobs:
  commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-core-gameplay-invariants
          fetch-depth: 0

      - name: Apply validated particle transform
        run: python3 scripts/patch_particle_emitter_cache.py

      - name: Verify transformed source
        shell: bash
        run: |
          grep -q 'oneShotEmitterCache = arrayOfNulls' app/src/main/java/com/anurag9000/forestrun/systems/ParticleManager.kt
          grep -q 'pendingUnlockParticle = true' app/src/main/java/com/anurag9000/forestrun/ui/GardenScreen.kt
          grep -q 'pendingUnlockParticle = false' app/src/main/java/com/anurag9000/forestrun/ui/GardenScreen.kt

      - name: Commit production particle remediation
        shell: bash
        run: |
          git show cd76c7eb0f6427c94612ae26f8b8690906aea6a8:.github/workflows/android-validation.yml > .github/workflows/android-validation.yml
          rm scripts/patch_particle_emitter_cache.py
          rm .github/workflows/commit-particle-remediation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: reuse particle emitters safely'
          git push origin HEAD:agent/fix-core-gameplay-invariants
