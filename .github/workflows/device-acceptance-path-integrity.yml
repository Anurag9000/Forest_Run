name: Device acceptance path integrity migration

on:
  push:
    branches: [main]
    paths:
      - scripts/migrate_device_acceptance_path_integrity.py
      - .github/workflows/device-acceptance-path-integrity.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Apply exact hardening
        run: python3 scripts/migrate_device_acceptance_path_integrity.py
      - name: Verify hardening
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 -m unittest discover -s scripts -p 'test_validate_device_acceptance.py'
          test ! -e scripts/migrate_device_acceptance_path_integrity.py
          test ! -e .github/workflows/device-acceptance-path-integrity.yml
          grep -q 'strict_json.loads(' scripts/validate_device_acceptance.py
          grep -q 'must not traverse a symbolic link' scripts/validate_device_acceptance.py
      - name: Commit descendant to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'forest-run-migration-bot'
          git config user.email 'forest-run-migration-bot@users.noreply.github.com'
          git add -A
          git commit -m 'fix(acceptance): harden physical evidence paths'
          git push origin HEAD:main
