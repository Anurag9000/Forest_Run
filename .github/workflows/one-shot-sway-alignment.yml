name: One-shot sway collision alignment

on:
  push:
    branches:
      - agent/fix-core-gameplay-invariants

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-core-gameplay-invariants
          fetch-depth: 0

      - name: Apply sway collision alignment
        run: python3 scripts/patch_sway_collision_alignment.py

      - name: Commit patched source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Sway collision source already aligned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/yourname/forest_run/entities/flora/Cactus.kt
          git add app/src/main/java/com/yourname/forest_run/entities/flora/LilyOfValley.kt
          git add app/src/main/java/com/yourname/forest_run/entities/flora/Hyacinth.kt
          git add app/src/main/java/com/yourname/forest_run/entities/flora/Eucalyptus.kt
          git add app/src/main/java/com/yourname/forest_run/entities/flora/VanillaOrchid.kt
          git add app/src/main/java/com/yourname/forest_run/entities/trees/WeepingWillow.kt
          git add app/src/main/java/com/yourname/forest_run/entities/trees/Jacaranda.kt
          git add app/src/main/java/com/yourname/forest_run/entities/trees/CherryBlossom.kt
          git commit -m "fix: keep decorative sway out of collision geometry"
          git push origin HEAD:agent/fix-core-gameplay-invariants
