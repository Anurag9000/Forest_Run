name: Audit ledger reconciliation migration

on:
  push:
    branches: [main]
    paths:
      - scripts/migrate_audit_ledger_reconciliation.py
      - .github/workflows/audit-ledger-reconciliation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - run: python3 scripts/migrate_audit_ledger_reconciliation.py
      - shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e scripts/migrate_audit_ledger_reconciliation.py
          test ! -e .github/workflows/audit-ledger-reconciliation.yml
          grep -q '## Current reconciliation — 2026-08-09' docs/AUDIT_LEDGER.md
          grep -q '## Historical tranche ledger' docs/AUDIT_LEDGER.md
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name 'forest-run-migration-bot'
          git config user.email 'forest-run-migration-bot@users.noreply.github.com'
          git add -A
          git commit -m 'docs(audit): reconcile remediation ledger with current source'
          git push origin HEAD:main
