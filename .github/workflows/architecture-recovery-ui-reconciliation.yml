name: Architecture recovery UI reconciliation

on:
  push:
    branches: [main]
    paths:
      - scripts/migrate_architecture_recovery_ui_status.py
      - .github/workflows/architecture-recovery-ui-reconciliation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - run: python3 scripts/migrate_architecture_recovery_ui_status.py
      - shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e scripts/migrate_architecture_recovery_ui_status.py
          test ! -e .github/workflows/architecture-recovery-ui-reconciliation.yml
          ! grep -q 'debug/support-only with no end-user UI' docs/ARCHITECTURE.md
          grep -q 'privacy-safe retry/discard UI' docs/ARCHITECTURE.md
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name 'forest-run-migration-bot'
          git config user.email 'forest-run-migration-bot@users.noreply.github.com'
          git add -A
          git commit -m 'docs(architecture): close recovery UI debt'
          git push origin HEAD:main
