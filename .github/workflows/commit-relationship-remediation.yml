name: Commit relationship remediation

on:
  push:
    branches:
      - agent/fix-core-gameplay-invariants

permissions:
  contents: write

jobs:
  commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-core-gameplay-invariants
          fetch-depth: 0

      - name: Apply validated transform
        run: python3 scripts/patch_relationship_progression.py

      - name: Commit production relationship semantics
        shell: bash
        run: |
          rm scripts/patch_relationship_progression.py
          rm .github/workflows/commit-relationship-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/anurag9000/forestrun/engine/RelationshipArcSystem.kt
          git add app/src/main/java/com/anurag9000/forestrun/engine/PersistentMemoryManager.kt
          git add app/src/test/java/com/anurag9000/forestrun/engine/RelationshipProgressionInvariantTest.kt
          git add app/src/test/java/com/anurag9000/forestrun/engine/ReturnMomentsSystemTest.kt
          git add -u scripts/patch_relationship_progression.py
          git add -u .github/workflows/commit-relationship-remediation.yml
          git commit -m "fix: earn relationship trust through positive outcomes"
          git push origin HEAD:agent/fix-core-gameplay-invariants
