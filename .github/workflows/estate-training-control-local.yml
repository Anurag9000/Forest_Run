name: Estate local training-control certificate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: estate-training-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Certify this repository with its local authority
        run: >-
          python run_all_training.py
          --training-control-audit
          --output .training_control/local_estate_certificate.json
      - name: Upload local certificate
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: estate-local-training-control-${{ github.sha }}
          path: .training_control/local_estate_certificate.json
          if-no-files-found: warn
          retention-days: 30
