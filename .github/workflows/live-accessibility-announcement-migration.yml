name: Live accessibility announcement migration

on:
  push:
    branches: [main]
    paths:
      - scripts/migrate_live_accessibility_announcements.py
      - .github/workflows/live-accessibility-announcement-migration.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-accessibility-announcement-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Apply exact announcement migration
        run: python3 scripts/migrate_live_accessibility_announcements.py
      - name: Verify result
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e scripts/migrate_live_accessibility_announcements.py
          test ! -e .github/workflows/live-accessibility-announcement-migration.yml
          grep -q 'AccessibilityAnnouncementPolicy()' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          grep -q 'manager.isTouchExplorationEnabled' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          grep -q 'updateAccessibilityAnnouncements()' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
          grep -q 'SystemClock.uptimeMillis()' app/src/main/java/com/anurag9000/forestrun/engine/GameView.kt
      - name: Commit directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'forest-run-migration-bot'
          git config user.email 'forest-run-migration-bot@users.noreply.github.com'
          git add -A
          git commit -m 'feat(accessibility): adopt throttled announcements live'
          git push origin HEAD:main
