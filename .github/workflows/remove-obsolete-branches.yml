name: Remove obsolete branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-obsolete-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete superseded branch refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            "agent/fix-core-gameplay-invariants" \
            "agent/forest-run-correctness-overhaul"
          do
            encoded_branch="${branch//\//%2F}"
            response_file="$(mktemp)"
            status="$({ curl --silent --show-error \
              --output "${response_file}" \
              --write-out '%{http_code}' \
              --request DELETE \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${REPOSITORY}/git/refs/heads/${encoded_branch}"; } || true)"
            if [[ "${status}" != "204" && "${status}" != "404" && "${status}" != "422" ]]; then
              cat "${response_file}"
              exit 1
            fi
            rm -f "${response_file}"
          done
